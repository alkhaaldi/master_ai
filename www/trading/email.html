<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Master AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Kufi+Arabic:wght@400;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#070D17;--navy-800:#0C1422;--navy-700:#111B2E;--navy-600:#172338;
  --gold:#C6974B;--gold-dim:#9A7A3E;--gold-bg:rgba(198,151,75,.07);--gold-br:rgba(198,151,75,.25);
  --green:#34D399;--green-bg:rgba(52,211,153,.07);--green-br:rgba(52,211,153,.3);
  --red:#F87171;--red-bg:rgba(248,113,113,.07);--red-br:rgba(248,113,113,.3);
  --amber:#FBBF24;--amber-bg:rgba(251,191,36,.07);--amber-br:rgba(251,191,36,.3);
  --cyan:#22D3EE;--cyan-bg:rgba(34,211,238,.07);--cyan-br:rgba(34,211,238,.3);
  --text:#E8EAED;--text-2:#9CA3AF;--text-3:#6B7280;--text-4:#4B5563;
  --card:rgba(12,20,34,.85);--card-border:rgba(198,151,75,.1);
  --fd:'Tajawal','Noto Kufi Arabic',sans-serif;--fm:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--navy-900);color:var(--text);font-family:var(--fd);min-height:100vh;overflow-x:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:var(--navy-800);border-bottom:1px solid var(--card-border);position:sticky;top:0;z-index:50}
.topbar-brand{font-size:.85rem;font-weight:700;color:var(--gold);display:flex;align-items:center;gap:8px}
.topbar-brand .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.topbar-meta{display:flex;align-items:center;gap:12px;font-family:var(--fm);font-size:.65rem;color:var(--text-3)}
.topbar-clock{color:var(--gold-dim);font-weight:600}
main{max-width:900px;margin:0 auto;padding:16px 20px 90px}
.page-title{text-align:center;font-size:1.3rem;font-weight:800;color:var(--text);padding:20px 0 6px}
.page-title span{color:var(--gold)}
.page-sub{text-align:center;font-family:var(--fm);font-size:.6rem;color:var(--text-3);margin-bottom:16px}
.section{margin-bottom:14px}
.section-hdr{font-size:.72rem;font-weight:700;color:var(--gold-dim);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.pulse-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pulse-chip{background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:14px;text-align:center}
.pulse-chip .pc-val{font-size:1.5rem;font-weight:800;font-family:var(--fm)}
.pulse-chip .pc-label{font-size:.58rem;color:var(--text-3);font-weight:600;margin-top:2px}
.pulse-chip.crit .pc-val{color:var(--red)}
.pulse-chip.high .pc-val{color:var(--amber)}
.pulse-chip.normal .pc-val{color:var(--text)}
.email-list{display:flex;flex-direction:column;gap:6px}
.email-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;background:var(--navy-700);border-radius:8px;border-right:3px solid var(--card-border)}
.email-item.pri-4{border-right-color:var(--red)}
.email-item.pri-3{border-right-color:var(--amber)}
.email-item.pri-2{border-right-color:var(--text-3)}
.email-item .em-pri{font-size:.5rem;padding:2px 6px;border-radius:4px;font-weight:700;white-space:nowrap}
.email-item .em-pri.p4{background:var(--red-bg);color:var(--red);border:1px solid var(--red-br)}
.email-item .em-pri.p3{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-br)}
.email-item .em-pri.p2{background:var(--navy-600);color:var(--text-3)}
.email-item .em-body{flex:1;min-width:0}
.email-item .em-subject{font-size:.72rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.email-item .em-from{font-size:.58rem;color:var(--text-3);margin-top:2px}
.email-item .em-time{font-family:var(--fm);font-size:.55rem;color:var(--text-4);white-space:nowrap}
.email-item .em-unread{width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:6px;flex-shrink:0}
.empty{color:var(--text-4);font-size:.72rem;text-align:center;padding:16px}
.nav-bar{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;padding:12px 0}
.nav-link{font-size:.62rem;padding:5px 10px;border-radius:6px;color:var(--text-3);background:var(--navy-700);border:1px solid var(--card-border);cursor:pointer;transition:.2s;text-decoration:none}
.nav-link:hover,.nav-link.active{color:var(--gold);border-color:var(--gold-br);background:var(--gold-bg)}
.footer{text-align:center;font-family:var(--fm);font-size:.5rem;color:var(--text-4);padding:12px;border-top:1px solid var(--card-border);margin-top:20px}
@media(max-width:500px){main{padding:12px 14px 90px}}
</style>
<link rel="stylesheet" href="indicator-tooltips.css">
</head>
<body>
<div class="topbar">
  <div class="topbar-brand"><span class="dot" id="dot"></span>Master AI</div>
  <div class="topbar-meta"><span class="topbar-clock" id="clock">--:--</span></div>
</div>
<main>
<div class="page-title">&#x1F4E7; <span>&#x0627;&#x0644;&#x0628;&#x0631;&#x064A;&#x062F;</span></div>
<div class="page-sub" id="page-sub">--</div>
<div class="section">
  <div class="pulse-row">
    <div class="pulse-chip crit"><div class="pc-val" id="p-crit">0</div><div class="pc-label">&#x1F6A8; &#x0639;&#x0627;&#x062C;&#x0644;</div></div>
    <div class="pulse-chip high"><div class="pc-val" id="p-high">0</div><div class="pc-label">&#x1F534; &#x0645;&#x0647;&#x0645;</div></div>
    <div class="pulse-chip normal"><div class="pc-val" id="p-total">0</div><div class="pc-label">&#x1F4EC; &#x063A;&#x064A;&#x0631; &#x0645;&#x0642;&#x0631;&#x0648;&#x0621;</div></div>
  </div>
</div>
<div class="section" id="urgent-sec" style="display:none">
  <div class="section-hdr">&#x1F6A8; &#x0639;&#x0627;&#x062C;&#x0644;</div>
  <div class="email-list" id="urgent-list"></div>
</div>
<div class="section" id="important-sec" style="display:none">
  <div class="section-hdr">&#x1F534; &#x0645;&#x0647;&#x0645;</div>
  <div class="email-list" id="important-list"></div>
</div>
<div class="section">
  <div class="section-hdr">&#x1F4EC; &#x0627;&#x0644;&#x0628;&#x0631;&#x064A;&#x062F;</div>
  <div class="email-list" id="other-list"><div class="empty">&#x062C;&#x0627;&#x0631;&#x064A; &#x0627;&#x0644;&#x062A;&#x062D;&#x0645;&#x064A;&#x0644;...</div></div>
</div>
<div class="nav-bar">
  <a class="nav-link" onclick="navTo('/trading/home')">&#x1F3E0; &#x0627;&#x0644;&#x0631;&#x0626;&#x064A;&#x0633;&#x064A;&#x0629;</a>
  <a class="nav-link" onclick="navTo('/trading/radar')">&#x1F4C8; &#x0627;&#x0644;&#x062A;&#x062F;&#x0627;&#x0648;&#x0644;</a>
  <a class="nav-link" onclick="navTo('/trading/signals')">&#x1F4E1; &#x0627;&#x0644;&#x0625;&#x0634;&#x0627;&#x0631;&#x0627;&#x062A;</a>
  <a class="nav-link" onclick="navTo('/trading/calendar')">&#x1F4C5; &#x0627;&#x0644;&#x0645;&#x0648;&#x0627;&#x0639;&#x064A;&#x062F;</a>
  <a class="nav-link" onclick="navTo('/trading/home-control')">&#x1F3E0; &#x0627;&#x0644;&#x0628;&#x064A;&#x062A;</a>
  <a class="nav-link" onclick="navTo('/trading/assistant')">&#x1F916; &#x0627;&#x0644;&#x0645;&#x0633;&#x0627;&#x0639;&#x062F;</a>
  <a class="nav-link" onclick="navTo('/trading/system')">&#x2699;&#xFE0F; &#x0627;&#x0644;&#x0646;&#x0638;&#x0627;&#x0645;</a>
  <a class="nav-link active">&#x1F4E7; &#x0627;&#x0644;&#x0628;&#x0631;&#x064A;&#x062F;</a>
  <a class="nav-link" onclick="navTo('/trading/news')">&#x1F4F0; &#x0627;&#x0644;&#x0623;&#x062E;&#x0628;&#x0627;&#x0631;</a>
    <a href="decisions" class="nav-link">القرارات</a>
    <a href="personality" class="nav-link">الشخصية</a>
</div>
</main>
<div class="footer" id="footer">&#x0622;&#x062E;&#x0631; &#x062A;&#x062D;&#x062F;&#x064A;&#x062B;: --</div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function navTo(p){window.location.href=p}
window.navTo=navTo;
function tickClock(){const now=new Date();const kwt=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Kuwait'}));$('clock').textContent=kwt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
setInterval(tickClock,1000);tickClock();
function renderEmail(e){
  const pCls=e.priority>=4?'p4':e.priority>=3?'p3':'p2';
  return '<div class="email-item pri-'+(e.priority||1)+'">'+(e.unread?'<div class="em-unread"></div>':'')+'<span class="em-pri '+pCls+'">'+esc(e.priority_label||'')+'</span><div class="em-body"><div class="em-subject">'+esc(e.subject)+'</div><div class="em-from">'+esc(e.from)+' \u00b7 '+esc(e.source_label||'')+'</div></div><div class="em-time">'+esc(e.time||'')+'</div></div>';
}
async function load(){
  let ext=null;
  try{ext=await fetch('/dashboard/extended').then(r=>r.ok?r.json():null).catch(()=>null)}catch(e){}
  $('dot').style.background=ext?'var(--green)':'var(--red)';
  if(ext){
    $('p-crit').textContent=ext.email_critical||0;
    $('p-high').textContent=ext.email_high||0;
    $('p-total').textContent=ext.email_unread||0;
    $('page-sub').textContent=(ext.email_total||0)+' \u0631\u0633\u0627\u0644\u0629 \u00b7 '+(ext.email_unread||0)+' \u063A\u064A\u0631 \u0645\u0642\u0631\u0648\u0621';
    const msgs=ext.email_messages||[];
    const urgent=msgs.filter(m=>m.priority>=4);
    const important=msgs.filter(m=>m.priority===3);
    const other=msgs.filter(m=>m.priority<3);
    if(urgent.length){$('urgent-sec').style.display='';$('urgent-list').innerHTML=urgent.map(renderEmail).join('')}else{$('urgent-sec').style.display='none'}
    if(important.length){$('important-sec').style.display='';$('important-list').innerHTML=important.map(renderEmail).join('')}else{$('important-sec').style.display='none'}
    $('other-list').innerHTML=other.length?other.map(renderEmail).join(''):'<div class="empty">\u0644\u0627 \u0631\u0633\u0627\u0626\u0644 \u0623\u062E\u0631\u0649</div>';
  }
  const now=new Date();const kwt=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Kuwait'}));
  $('footer').textContent='\u0622\u062E\u0631 \u062A\u062D\u062F\u064A\u062B: '+kwt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
load();setInterval(load,60000);
})();
</script>
<script src="indicator-tooltips.js"></script>
</body>
</html>
