<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قرارات الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Noto+Kufi+Arabic:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#071528; --navy-800:#0B1E3A; --navy-700:#0F2A4F;
  --line:#1E3A5F; --line-soft:#182F4D;
  --gold:#C9A227; --gold-bright:#E3BE4A; --gold-dim:#8A7220;
  --txt:#E8EEF6; --txt-2:#A9BBD1; --txt-3:#6B819C;
  --up:#2FAE6E; --down:#E05252; --warn:#E8A33D;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(180deg,var(--navy-900),var(--navy-800) 40%);color:var(--txt);
     font-family:'Tajawal',system-ui,sans-serif;min-height:100vh;padding:14px;font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto}
h1,h2{font-family:'Noto Kufi Arabic',sans-serif;font-weight:700;letter-spacing:-.01em}
.m{font-family:'IBM Plex Mono',monospace;direction:ltr;display:inline-block;font-variant-numeric:tabular-nums}

.head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.head h1{font-size:22px;color:var(--gold)}
.head .sub{color:var(--txt-3);font-size:13px}
.grow{flex:1;min-width:10px}

.banner{border-radius:var(--r);padding:13px 18px;margin-bottom:14px;display:flex;align-items:center;
        gap:14px;flex-wrap:wrap;border:1px solid transparent;position:relative;overflow:hidden}
.banner::before{content:'';position:absolute;inset:0 auto 0 0;width:4px}
.banner .ic{font-size:20px;line-height:1}
.banner .main{flex:1;min-width:190px}
.banner .t{font-weight:700;font-size:15px;font-family:'Noto Kufi Arabic',sans-serif}
.banner .s{font-size:12.5px;opacity:.85;margin-top:1px}
.b-ok{background:rgba(47,174,110,.08);border-color:rgba(47,174,110,.32)} .b-ok::before{background:var(--up)}
.b-warn{background:rgba(232,163,61,.1);border-color:rgba(232,163,61,.4)} .b-warn::before{background:var(--warn)}
.b-bad{background:rgba(178,58,58,.13);border-color:rgba(224,82,82,.45)} .b-bad::before{background:var(--down)}
.chip{font-family:'IBM Plex Mono',monospace;direction:ltr;font-size:11.5px;background:rgba(0,0,0,.3);
      border:1px solid rgba(255,255,255,.12);padding:5px 10px;border-radius:8px;white-space:nowrap}
.btn{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#1A1206;border:0;
     border-radius:10px;padding:9px 18px;font-family:'Tajawal',sans-serif;font-weight:700;font-size:14px;
     cursor:pointer;white-space:nowrap;transition:.15s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:wait}

/* سجل الحلقة - يحل محل شارة الثقة */
.rec{background:linear-gradient(135deg,#14304f,#0d2340);border:1px solid rgba(201,162,39,.42);
     border-radius:var(--r);padding:16px 20px;margin-bottom:14px}
.rec .cap{color:var(--gold-dim);font-size:12px;letter-spacing:.04em;margin-bottom:10px}
.rec .row{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end}
.rec .u{min-width:74px}
.rec .n{font-family:'IBM Plex Mono',monospace;direction:ltr;font-size:28px;font-weight:600;line-height:1.1}
.rec .k{font-size:12px;color:var(--txt-3);margin-top:2px}
.rec .why{font-size:12.5px;color:var(--txt-2);margin-top:11px;padding-top:10px;
          border-top:1px solid rgba(255,255,255,.09);line-height:1.65}

.pulse{background:linear-gradient(135deg,#14304f,#0d2340);border:1px solid rgba(201,162,39,.42);
       border-radius:var(--r);padding:18px 20px;margin-bottom:14px;display:flex;align-items:center;
       gap:18px;flex-wrap:wrap}
.pulse .lbl{color:var(--gold-dim);font-size:12px;letter-spacing:.04em;margin-bottom:4px}
.pulse .sym{font-family:'IBM Plex Mono',monospace;direction:ltr;font-size:30px;font-weight:600;color:var(--gold-bright)}
.pulse .co{color:var(--txt-2);font-size:13px}
.pulse .none{color:var(--txt-3);font-size:15px;font-family:'Noto Kufi Arabic',sans-serif}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.card{background:linear-gradient(160deg,var(--navy-700),var(--navy-800));border:1px solid var(--line);
      border-radius:var(--r);padding:15px}
.card .lbl{color:var(--txt-3);font-size:12px;margin-bottom:7px}
.card .val{font-family:'IBM Plex Mono',monospace;direction:ltr;font-size:26px;font-weight:600;line-height:1.15}
.card .note{font-size:11.5px;color:var(--txt-3);margin-top:5px}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--txt-3)} .warn{color:var(--warn)}

.sec{background:rgba(11,30,58,.55);border:1px solid var(--line-soft);border-radius:var(--r);
     margin-bottom:14px;overflow:hidden}
.sec>h2{font-size:15px;padding:12px 16px;border-bottom:1px solid var(--line-soft);color:var(--txt-2)}
.sec>h2 .hint{float:left;font-size:11.5px;color:var(--txt-3);font-weight:400;font-family:'Tajawal',sans-serif}
.sec .bd{padding:6px 16px 14px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:right;color:var(--txt-3);font-weight:500;font-size:12px;padding:9px 8px;
   border-bottom:1px solid var(--line-soft);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid rgba(30,58,95,.42);vertical-align:middle}
tr:last-child td{border-bottom:0}
.sym{font-family:'IBM Plex Mono',monospace;direction:ltr;font-weight:600;color:var(--gold-bright)}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.07);
     border:1px solid rgba(255,255,255,.12);color:var(--txt-2);white-space:nowrap;display:inline-block;margin:1px 0 1px 3px}

/* المقاييس المعلّقة */
.susp{border:1px dashed rgba(232,163,61,.5);background:rgba(232,163,61,.06);border-radius:var(--r);
      margin-bottom:14px;overflow:hidden}
.susp summary{padding:13px 18px;cursor:pointer;list-style:none;font-family:'Noto Kufi Arabic',sans-serif;
              font-weight:700;font-size:14.5px;color:var(--warn);display:flex;gap:10px;align-items:center}
.susp summary::-webkit-details-marker{display:none}
.susp .why{padding:0 18px 14px;font-size:13px;color:var(--txt-2);line-height:1.7}
.susp .why code{font-family:'IBM Plex Mono',monospace;direction:ltr;font-size:11.5px;
                background:rgba(0,0,0,.35);padding:2px 7px;border-radius:6px;display:inline-block}
.susp .bd{padding:0 18px 16px}

.empty{color:var(--txt-3);text-align:center;padding:26px 14px;font-size:14px;line-height:1.8}
.foot{color:var(--txt-3);font-size:11.5px;padding:12px 4px 24px;line-height:1.9;
      border-top:1px solid var(--line-soft);margin-top:6px}
.foot .m{color:var(--txt-2)}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <h1>قرارات الدخول</h1>
    <span class="sub" id="scanSub">جارٍ التحميل…</span>
    <span class="sub" id="sessNote"></span>
    <span class="grow"></span>
    <button class="btn" id="rf" onclick="load()">تحديث</button>
  </div>

  <!-- 1. حالة البيانات -->
  <div class="banner b-warn" id="banner">
    <div class="ic">…</div>
    <div class="main"><div class="t">جارٍ قراءة حالة البيانات</div>
      <div class="s">لا تُتخذ قرارات قبل ظهور الحالة</div></div>
  </div>

  <!-- 2. سجل الحلقة - يحل محل شارة الثقة -->
  <div class="rec" id="rec">
    <div class="cap">سجل قرارات هذه الصفحة — النتائج المقيسة فعلاً</div>
    <div id="recBody" class="empty" style="padding:10px 0">جارٍ القراءة…</div>
  </div>

  <!-- 3. أعلى فرصة - وقائع فقط -->
  <div class="pulse" id="pulse">
    <div><div class="lbl">أعلى الفرص المرصودة</div>
      <div class="none">جارٍ التحميل…</div></div>
  </div>

  <!-- 3.5 هل كانت صحيحة؟ الثقة وقتها مقابل ما حدث فعلاً -->
  <div class="sec">
    <h2>هل كانت صحيحة؟ <span class="hint" id="verdictHint"></span></h2>
    <div class="bd" id="verdictWrap"><div class="empty">جارٍ القراءة…</div></div>
  </div>

  <!-- 4. البطاقات -->
  <div class="cards" id="cards"></div>

  <!-- 5. الفرص -->
  <div class="sec">
    <h2>الفرص المرصودة <span class="hint" id="oppHint"></span></h2>
    <div class="bd" id="oppWrap"><div class="empty">جارٍ التحميل…</div></div>
  </div>

  <!-- 6. المقاييس المعلّقة -->
  <details class="susp" id="susp">
    <summary><span>⏸</span><span>مقاييس معلّقة — لا تُستخدم للقرار</span></summary>
    <div class="why" id="suspWhy"></div>
    <div class="bd" id="suspBody"></div>
  </details>

  <div class="foot" id="foot"></div>
</div>

<script src="nav.js"></script>
<script>
const API   = '/api/decisions-now';
const REV   = '/dashboard/reviews';
const SUSPEND_REASON = 'C-27: hit-rate basis was measured with broken evaluation windows';

const $ = id => document.getElementById(id);
const has = v => v !== null && v !== undefined && v !== '';
const num = (v, d) => has(v) && isFinite(v) ? Number(v).toFixed(d === undefined ? 2 : d) : '—';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- حالة البيانات: خمس حالات، بعمر الجلسات لا الساعات ---- */
const STATES = {
  normal:   {c:'b-ok',   ic:'✓', t:'البيانات سليمة',
             s:'آخر جلسة مغلقة مقروءة بالكامل'},
  live:     {c:'b-ok',   ic:'●', t:'بيانات حيّة',
             s:'الجلسة مفتوحة والأسعار تتحدث'},
  degraded: {c:'b-warn', ic:'▲', t:'البيانات متأخرة',
             s:'مضت جلسات دون تحديث — الأرقام أقدم مما تبدو'},
  broken:   {c:'b-bad',  ic:'✕', t:'البيانات مكسورة',
             s:'المصدر يرد بما لا يصلح للقياس'},
  blind:    {c:'b-bad',  ic:'∅', t:'لا توجد بيانات',
             s:'هذا ليس غياب فرص — هذا غياب قياس'}
};

/* data_freshness يتكلم بالأيام (stale_1d) بينما بقية النظام يتكلم
   بالجلسات. نترجم هنا حتى تُقرأ الصفحة بنفس لغة swing/radar. */
function mapFreshness(f, generatedAt){
  if (!has(f)) return {key:'blind', extra:'لا حقل حالة في الحمولة'};
  const s = String(f).toLowerCase();
  if (s === 'live' || s === 'fresh')  return {key:'live',   extra:''};
  if (s === 'normal' || s === 'ok')   return {key:'normal', extra:''};
  const md = s.match(/stale[_-](\d+)d/);
  if (md){
    const d = parseInt(md[1], 10);
    return d <= 1
      ? {key:'normal',   extra:'آخر إغلاق متاح — لا جلسة فاتت'}
      : {key:'degraded', extra:'أقدم من جلسة واحدة (' + d + ' يوماً)'};
  }
  if (s.indexOf('stale') >= 0)  return {key:'degraded', extra:'الحمولة تقول ' + esc(f)};
  if (s.indexOf('no') === 0 || s.indexOf('missing') >= 0) return {key:'blind', extra:''};
  return {key:'degraded', extra:'حالة غير معروفة: ' + esc(f)};
}

/* ---- سجل الحلقة ---- */
function renderRecord(rv){
  const el = $('recBody');
  const lt = rv && rv.lifetime ? rv.lifetime : null;

  if (!lt){
    /* لا نخترع رقماً. نقول ما ينقص بالاسم. */
    const last = rv && has(rv.last_review_date) ? esc(rv.last_review_date) : '—';
    const sess = rv && has(rv.sessions_since_last_review) ? rv.sessions_since_last_review : '—';
    el.className = '';
    el.innerHTML =
      '<div class="empty" style="padding:6px 0;text-align:right">' +
      'السجل التراكمي غير متاح على الخادم بعد — ينقص الحقل ' +
      '<span class="chip">reviews.lifetime</span><br>' +
      'المتاح الآن: آخر مراجعة <span class="m">' + last + '</span> · ' +
      'جلسات منذ آخر مراجعة <span class="m">' + sess + '</span>' +
      '</div>';
    return;
  }

  const r = lt.results || {};
  const graded   = has(lt.graded_total)   ? lt.graded_total   : '—';
  const resolved = has(lt.resolved_total) ? lt.resolved_total : '—';
  const win  = has(r.success) ? r.success : 0;
  const lose = has(r.fail)    ? r.fail    : 0;
  const t1   = has(lt.hit_target_1) ? lt.hit_target_1 : 0;
  const st   = has(lt.hit_stop)     ? lt.hit_stop     : 0;
  const nd   = has(r.no_data) ? r.no_data : 0;

  el.className = '';
  el.innerHTML =
    '<div class="row">' +
      '<div class="u"><div class="n">' + graded + '</div><div class="k">قرار مُقيَّم</div></div>' +
      '<div class="u"><div class="n">' + resolved + '</div><div class="k">محسوم</div></div>' +
      '<div class="u"><div class="n up">' + win + '</div><div class="k">نجاح</div></div>' +
      '<div class="u"><div class="n down">' + lose + '</div><div class="k">فشل</div></div>' +
      '<div class="u"><div class="n up">' + t1 + '</div><div class="k">بلغ الهدف</div></div>' +
      '<div class="u"><div class="n down">' + st + '</div><div class="k">ضرب الوقف</div></div>' +
      '<div class="u"><div class="n muted">' + nd + '</div><div class="k">بلا بيانات</div></div>' +
    '</div>' +
    '<div class="why">' + recordNote(lt, win, lose, t1, st) + '</div>';
}

function recordNote(lt, win, lose, t1, st){
  const bits = [];
  if ((win + lose) === 0){
    bits.push('لم يُحسم أي قرار بعد. أي رقم ثقة هنا لن يكون مسنوداً بنتيجة مقيسة.');
  } else {
    bits.push('نسبة صغيرة العيّنة — تُقرأ كمؤشر لا كحكم.');
    if (st > t1) bits.push('حتى الآن ضربات الوقف أكثر من بلوغ الأهداف.');
  }
  const bm = lt.by_graded_mode || {};
  if (has(bm.legacy) && bm.legacy > 0)
    bits.push(bm.legacy + ' منها قِيست بالمسطرة القديمة وتدخل سلة إعادة القياس.');
  if (has(bm.ungraded) && bm.ungraded > 0)
    bits.push(bm.ungraded + ' بلا قياس إطلاقاً — فجوة تغطية لا نتيجة محايدة.');
  if (has(lt.sessions_since_last_review) && lt.sessions_since_last_review > 1)
    bits.push('مضت ' + lt.sessions_since_last_review + ' جلسات دون مراجعة.');
  return bits.join(' ');
}

/* ---- الوقف: قيمة واحدة معتمدة + مصدرها ---- */
function stopCell(o){
  const cp = o.chosen_plan || {};
  if (!has(cp.stop)) return '<span class="muted">—</span>';
  const src = has(o.stop_source) ? o.stop_source : (has(cp.source) ? cp.source : '');
  const pct = has(cp.stop_pct) ? ' <span class="muted m">' + num(cp.stop_pct, 1) + '%</span>' : '';
  return '<span class="m">' + num(cp.stop, 3) + '</span>' + pct +
         (src ? '<br><span class="tag">' + esc(src) + '</span>' : '');
}

/* ---- النمط: عربي أولاً، والذرات الخام تفصيل ثانوي ---- */
function patternCell(o){
  const out = [];
  if (has(o.pattern_ar))
    out.push('<div style="color:var(--txt);font-size:13px;line-height:1.5">' + esc(o.pattern_ar) + '</div>');
  const a = Array.isArray(o.live_atoms) ? o.live_atoms : [];
  if (a.length){
    const show = a.slice(0, 4).map(x => '<span class="tag">' + esc(x) + '</span>').join('');
    const more = a.length > 4 ? '<span class="tag">+' + (a.length - 4) + '</span>' : '';
    out.push('<div style="margin-top:3px;opacity:.72">' + show + more + '</div>');
  }
  return out.length ? out.join('') : '<span class="muted">—</span>';
}

/* ---- خطة الصفقة: من chosen_plan وحده، كما فعلنا بالوقف ---- */
function planCell(o){
  const cp = o.chosen_plan || {};
  if (!has(cp.entry) && !has(cp.target1)) return '<span class="muted">—</span>';
  const bits = [];
  if (has(cp.entry))   bits.push('دخول <span class="m">' + num(cp.entry, 1) + '</span>');
  if (has(cp.target1)) bits.push('هدف١ <span class="m up">' + num(cp.target1, 1) + '</span>');
  if (has(cp.target2)) bits.push('هدف٢ <span class="m up">' + num(cp.target2, 1) + '</span>');
  if (has(cp.rr))      bits.push('R/R <span class="m">' + num(cp.rr, 2) + '</span>');
  return bits.join('<br>');
}

/* ---- هل كانت صحيحة؟ ----
   الاختبار الوحيد الصادق: الثقة المعلنة وقت القرار مقابل ما حدث بعده.
   إن لم تفرّق الثقة بين الناجح والفاشل، فهي رقم لا يحمل معلومة. ---- */
const RESULT_AR = {
  success:  ['نجح',        'up'],
  fail:     ['فشل',        'down'],
  partial:  ['جزئي',       'warn'],
  ongoing:  ['قائم',       'muted'],
  no_data:  ['بلا بيانات', 'muted'],
  ungraded: ['بلا قياس',   'muted']
};

function renderPastCalls(rv){
  const w = $('verdictWrap');
  const rows = (rv && Array.isArray(rv.reviews)) ? rv.reviews : [];
  const lt = rv && rv.lifetime ? rv.lifetime : null;

  if (!rows.length){
    w.innerHTML = '<div class="empty">لا قرارات مقيَّمة معروضة.<br>' +
      'الخادم يرجّع شريحة يوم واحد فقط — ينقص الحقل ' +
      '<span class="chip">reviews.recent</span> ليُعرض آخر ما قِيس عبر التواريخ.</div>';
    $('verdictHint').textContent = '';
    return;
  }

  /* معايرة: هل الثقة تفصل الناجح عن الفاشل؟ */
  const wins = rows.filter(r => r.result === 'success' && has(r.confidence));
  const loss = rows.filter(r => r.result === 'fail'    && has(r.confidence));
  const avg  = a => a.length ? a.reduce((s, r) => s + Number(r.confidence), 0) / a.length : null;
  const cw = avg(wins), cl = avg(loss);

  let calib = '';
  if (cw !== null && cl !== null){
    const gap = cw - cl;
    calib = 'متوسط الثقة عند النجاح <span class="m up">' + num(cw, 1) + '</span> ' +
            'مقابل <span class="m down">' + num(cl, 1) + '</span> عند الفشل — ' +
            (Math.abs(gap) < 3
              ? '<span class="warn">الفرق ضئيل: الثقة لا تكاد تميّز الناجح من الفاشل.</span>'
              : (gap > 0 ? 'الثقة تميل في الاتجاه الصحيح، والعيّنة صغيرة.'
                         : '<span class="down">الثقة أعلى في الصفقات الفاشلة — إشارة معكوسة.</span>'));
  } else {
    calib = 'لا تكفي النتائج المحسومة لقياس معايرة الثقة بعد.';
  }

  $('verdictHint').textContent = 'المصدر: signal_reviews' +
    (has(rv.date) ? ' — ' + rv.date : '');

  let h = '<div style="font-size:12.5px;color:var(--txt-2);margin:2px 0 12px;line-height:1.7">' +
          calib + '</div>' +
          '<table><thead><tr><th>الرمز</th><th>الثقة وقتها</th><th>دخول / وقف / هدف</th>' +
          '<th>ما حدث فعلاً</th><th>النتيجة</th><th>الأقصى ربحاً / خسارة</th>' +
          '<th>الدرس</th></tr></thead><tbody>';

  rows.forEach(r => {
    const res = RESULT_AR[r.result] || [esc(r.result || '—'), 'muted'];
    const pnl = has(r.pnl_pct) ? Number(r.pnl_pct) : null;
    h += '<tr>' +
      '<td><span class="sym">' + esc(r.symbol) + '</span>' +
        (has(r.market_date) ? '<br><span class="tag">' + esc(r.market_date) + '</span>' : '') +
        (r.graded_mode && r.graded_mode !== 'live'
          ? '<span class="tag">' + esc(r.graded_mode) + '</span>' : '') + '</td>' +
      '<td><span class="m">' + num(r.confidence, 1) + '</span></td>' +
      '<td style="font-size:12px"><span class="m">' + num(r.entry_price, 1) + '</span> / ' +
        '<span class="m down">' + num(r.stop_price, 1) + '</span> / ' +
        '<span class="m up">' + num(r.target_1, 1) + '</span></td>' +
      '<td style="font-size:12px">أعلى <span class="m">' + num(r.next_day_high, 1) + '</span>' +
        '<br>أدنى <span class="m">' + num(r.next_day_low, 1) + '</span>' +
        '<br>إغلاق <span class="m">' + num(r.next_day_close, 1) + '</span></td>' +
      '<td><span class="' + res[1] + '" style="font-weight:700">' + res[0] + '</span>' +
        (pnl === null ? '' : '<br><span class="m ' + (pnl >= 0 ? 'up' : 'down') + '">' +
          num(pnl, 2) + '%</span>') +
        (r.hit_target_1 ? '<br><span class="tag">بلغ الهدف</span>' : '') +
        (r.hit_stop ? '<br><span class="tag">ضرب الوقف</span>' : '') + '</td>' +
      '<td style="font-size:12px"><span class="m up">' + num(r.max_favorable, 1) + '%</span>' +
        '<br><span class="m down">' + num(r.max_adverse, 1) + '%</span></td>' +
      '<td style="font-size:12px;color:var(--txt-2)">' +
        (has(r.lesson_ar) ? esc(r.lesson_ar) : '<span class="muted">—</span>') +
        (has(r.error_type) && r.error_type !== 'none'
          ? '<br><span class="tag">' + esc(r.error_type) + '</span>' : '') + '</td>' +
    '</tr>';
  });
  h += '</tbody></table>';

  if (lt && has(lt.graded_total) && rows.length < lt.graded_total){
    h += '<div class="note" style="color:var(--txt-3);font-size:11.5px;margin-top:9px">' +
         'معروض ' + rows.length + ' من ' + lt.graded_total + ' قراراً مقيَّماً — ' +
         'الخادم يرجّع شريحة يوم واحد. الحقل <span class="m">reviews.recent</span> ' +
         'يعرض الباقي عبر التواريخ.</div>';
  }
  w.innerHTML = h;
}

/* ---- الرسم الرئيسي ---- */
function render(d, rv){
  const opps = Array.isArray(d.all_opportunities) ? d.all_opportunities : [];
  const f0   = opps.length ? opps[0].data_freshness : null;
  const st   = mapFreshness(f0, d.generated_at);
  const S    = STATES[st.key] || STATES.blind;
  const bad  = (st.key === 'broken' || st.key === 'blind');

  /* لافتة الحالة */
  const b = $('banner');
  b.className = 'banner ' + S.c;
  b.innerHTML =
    '<div class="ic">' + S.ic + '</div>' +
    '<div class="main"><div class="t">' + S.t + '</div>' +
    '<div class="s">' + S.s + (st.extra ? ' — ' + st.extra : '') + '</div></div>' +
    (has(f0) ? '<span class="chip">' + esc(f0) + '</span>' : '') +
    (has(d.generated_at) ? '<span class="chip">' + esc(d.generated_at) + '</span>' : '');

  $('scanSub').textContent = 'مسح ' + (has(d.total_scanned) ? d.total_scanned : '—') + ' سهماً';

  renderRecord(rv);
  renderPastCalls(rv);

  /* أعلى فرصة — وقائع فقط، بلا ثقة ولا حكم */
  const p = $('pulse');
  if (!opps.length || bad){
    p.innerHTML = '<div><div class="lbl">أعلى الفرص المرصودة</div>' +
      '<div class="none">' + (bad ? 'لا يُعرض ترتيب على بيانات غير سليمة'
                                  : 'لا فرص مطابقة للشروط') + '</div></div>';
  } else {
    const o = opps[0];
    const ch = has(o.change_pct) ? Number(o.change_pct) : null;
    p.innerHTML =
      '<div><div class="lbl">أعلى الفرص المرصودة</div>' +
        '<div class="sym">' + esc(o.symbol) + '</div>' +
        '<div class="co">' + esc(o.name_ar || o.sector || '') + '</div></div>' +
      '<div><div class="lbl">السعر</div><div class="sym">' + num(o.price, 1) + '</div>' +
        (ch === null ? '' : '<div class="co ' + (ch >= 0 ? 'up' : 'down') + '">' +
          '<span class="m">' + num(ch, 2) + '%</span> آخر إغلاق</div>') + '</div>' +
      '<div><div class="lbl">الوقف المعتمد</div><div class="co" style="font-size:15px">' +
        stopCell(o) + '</div></div>' +
      '<div class="grow"></div>' +
      '<div style="max-width:300px"><div class="lbl">النمط</div>' +
        '<div>' + patternCell(o) + '</div></div>';
  }

  /* البطاقات */
  $('cards').innerHTML =
    card('سهماً في المسح', d.total_scanned, '') +
    card('فرصة مطابقة', d.total_opportunities, '') +
    card('سقف المركز', has(opps[0] && opps[0].max_position_kwd) ? opps[0].max_position_kwd : null,
         'دينار — لأعلى فرصة') +
    card('حالة السوق', null, '', d.market_status || (has(d.generated_at) ? 'حسب آخر مسح' : '—'));

  /* الجدول */
  $('oppHint').textContent = 'المصدر: 1D — آخر إغلاق مخزّن';
  const w = $('oppWrap');
  if (bad){
    w.innerHTML = '<div class="empty">الترتيب محجوب.<br>' +
      'البيانات في حالة «' + S.t + '» — عرض ترتيب فوقها يصنع ثقة بلا أساس.</div>';
  } else if (!opps.length){
    w.innerHTML = '<div class="empty">لا فرص مطابقة اليوم.<br>' +
      'هذا غياب فرص، لا غياب بيانات — الحالة أعلاه سليمة.</div>';
  } else {
    let h = '<table><thead><tr><th>الرمز</th><th>السعر</th><th>التغير</th>' +
            '<th>الوقف المعتمد</th><th>خطة الصفقة</th><th>دعم / مقاومة</th><th>السيولة</th>' +
            '<th>النمط والشروط</th></tr></thead><tbody>';
    opps.forEach(o => {
      const ch = has(o.change_pct) ? Number(o.change_pct) : null;
      h += '<tr>' +
        '<td><span class="sym">' + esc(o.symbol) + '</span>' +
          (has(o.name_ar) ? '<br><span style="font-size:12px;color:var(--txt-2)">' + esc(o.name_ar) + '</span>' : '') +
          (has(o.sector) ? '<br><span class="tag">' + esc(o.sector) + '</span>' : '') + '</td>' +
        '<td><span class="m">' + num(o.price, 1) + '</span></td>' +
        '<td>' + (ch === null ? '<span class="muted">—</span>' :
          '<span class="m ' + (ch >= 0 ? 'up' : 'down') + '">' + num(ch, 2) + '%</span>') + '</td>' +
        '<td>' + stopCell(o) + '</td>' +
        '<td style="font-size:12.5px;line-height:1.7">' + planCell(o) + '</td>' +
        '<td><span class="m">' + num(o.key_support, 1) + '</span> / ' +
            '<span class="m">' + num(o.key_resistance, 1) + '</span></td>' +
        '<td>' + (has(o.max_position_kwd)
            ? '<span class="m">' + o.max_position_kwd + '</span>' : '<span class="muted">—</span>') + '</td>' +
        '<td>' + patternCell(o) + '</td>' +
      '</tr>';
    });
    w.innerHTML = h + '</tbody></table>';
  }

  renderSuspended(opps);
  const tpWarn = opps.some(o => o.trade_plan && o.chosen_plan &&
                            has(o.trade_plan.target_1) && has(o.chosen_plan.target1) &&
                            Math.abs(o.trade_plan.target_1 - o.chosen_plan.target1) > 0.01);
  $('foot').innerHTML =
    'المصدر: <span class="m">' + API + '</span><br>' +
    'آخر جلب: <span class="m">' + lastFetch + '</span> · ' +
    'وقت التوليد: <span class="m">' + esc(d.generated_at || '—') + '</span> ' +
    '<span class="muted">(بلا منطقة زمنية معلنة — بند E-4)</span><br>' +
    'الوقف وخطة الصفقة كلاهما من <span class="m">chosen_plan</span> وحده؛ ' +
    'مرشحات الوقف الأخرى تشخيصية في <span class="m">stop_candidates</span>.' +
    (tpWarn ? '<br><span class="warn">تنبيه: <span class="m">trade_plan</span> يحمل أهدافاً مختلفة ' +
              'عن <span class="m">chosen_plan</span> في الحمولة نفسها — تكرار لم يُوحَّد بعد ' +
              '(نفس علة الوقوف الثلاثة قبل E-2). المعروض هنا هو chosen_plan.</span>' : '');
}

function card(lbl, val, note, txt){
  return '<div class="card"><div class="lbl">' + lbl + '</div>' +
    '<div class="val">' + (txt !== undefined ? '<span style="font-size:17px">' + esc(txt) + '</span>'
                                             : (has(val) ? val : '—')) + '</div>' +
    (note ? '<div class="note">' + note + '</div>' : '') + '</div>';
}

/* ---- المقاييس المعلّقة: كل رقم مشتق من hit/miss خلف باب واحد ---- */
const SUSPENDED_FIELDS = [
  ['confidence',       'الثقة'],
  ['win_rate',         'نسبة النجاح'],
  ['pattern_score',    'درجة النمط'],
  ['baseline_wr',      'خط الأساس'],
  ['entry_score',      'درجة الدخول'],
  ['smart_decision_ar','القرار الذكي'],
  ['entry_status_ar',  'حالة الدخول'],
  ['personality_ar',   'شخصية السهم']
];

function renderSuspended(opps){
  $('suspWhy').innerHTML =
    'كل رقم هنا مشتق من نوافذ تقييم hit/miss التي وُجد <span class="m">C-27</span> ' +
    'لإعادة قياسها. هذا هو نفس السبب المكتوب على السلك لإيقاف القائمة البيضاء:<br>' +
    '<code>' + esc(SUSPEND_REASON) + '</code><br>' +
    'يُرفع الحجب من هذا المكان وحده حين تنتهي إعادة القياس — ' +
    'ولا يُرفع لأن الرقم بدا معقولاً.';

  if (!opps.length){ $('suspBody').innerHTML = ''; return; }
  let h = '<table><thead><tr><th>الرمز</th>' +
          SUSPENDED_FIELDS.map(f => '<th>' + f[1] + '</th>').join('') +
          '<th>عيّنة</th></tr></thead><tbody>';
  opps.slice(0, 10).forEach(o => {
    h += '<tr><td><span class="sym">' + esc(o.symbol) + '</span></td>';
    SUSPENDED_FIELDS.forEach(f => {
      const v = o[f[0]];
      h += '<td class="muted">' + (has(v) ? (isFinite(v) ? '<span class="m">' + num(v, 1) + '</span>'
                                                         : esc(v)) : '—') + '</td>';
    });
    const sm = o.strategy_match || {};
    const samples = [o.occurrences, sm.sample_size, sm.total_matches]
      .map(x => has(x) ? x : '—').join(' / ');
    h += '<td class="muted"><span class="m">' + samples + '</span></td></tr>';
  });
  h += '</tbody></table>' +
       '<div class="note" style="color:var(--txt-3);font-size:11.5px;margin-top:9px">' +
       'عمود العيّنة: occurrences / sample_size / total_matches — ثلاثة أعداد مختلفة ' +
       'في السجل الواحد، ولم يُبيَّن أيها بُنيت عليه الثقة.</div>';
  $('suspBody').innerHTML = h;
}

/* ---- التحميل ----
   تلقائي أثناء الجلسة فقط (أحد-خميس 09:00-13:00 بتوقيت الكويت).
   خارجها يدوي: الحركة المستمرة على بيانات ساكنة توهم بالطزاجة.
   وفي الحالتين يُعرض ختم "آخر جلب" حتى لا يُخمَّن عمر ما تراه. ---- */
let lastFetch = '—';
let timer = null;

function kuwaitNow(){
  /* الكويت UTC+3 بلا توقيت صيفي */
  return new Date(Date.now() + (3 * 60 + new Date().getTimezoneOffset()) * 60000);
}
function inSession(){
  const t = kuwaitNow(), d = t.getDay(), h = t.getHours();
  return (d >= 0 && d <= 4) && h >= 9 && h < 13;   /* الأحد=0 .. الخميس=4 */
}
function stamp(){
  const t = kuwaitNow();
  const p = n => String(n).padStart(2, '0');
  return p(t.getHours()) + ':' + p(t.getMinutes()) + ':' + p(t.getSeconds());
}
function reschedule(){
  if (timer) { clearInterval(timer); timer = null; }
  if (inSession()) timer = setInterval(load, 120000);
  const s = $('sessNote');
  if (s) s.textContent = inSession() ? 'الجلسة مفتوحة — تحديث تلقائي كل دقيقتين'
                                     : 'خارج الجلسة — تحديث يدوي';
}

async function load(){
  const btn = $('rf'); btn.disabled = true; btn.textContent = 'جارٍ…';
  let d = null, rv = null;
  try {
    const r = await fetch(API + '?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    d = await r.json();
    lastFetch = stamp();
  } catch (e) {
    $('banner').className = 'banner b-bad';
    $('banner').innerHTML = '<div class="ic">✕</div><div class="main">' +
      '<div class="t">تعذّر جلب القرارات</div>' +
      '<div class="s">' + esc(e.message) + ' — لا يُعرض شيء بدل البيانات</div></div>';
    $('oppWrap').innerHTML = '<div class="empty">لا اتصال بالمصدر.</div>';
    btn.disabled = false; btn.textContent = 'تحديث';
    return;
  }
  try {
    const r2 = await fetch(REV + '?t=' + Date.now(), {cache:'no-store'});
    if (r2.ok) rv = await r2.json();
  } catch (e) { rv = null; }

  render(d, rv);
  reschedule();
  btn.disabled = false; btn.textContent = 'تحديث';
}

load();
</script>
