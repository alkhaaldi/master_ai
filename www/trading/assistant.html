<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Master AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Kufi+Arabic:wght@400;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#070D17;--navy-800:#0C1422;--navy-700:#111B2E;--navy-600:#172338;
  --gold:#C6974B;--gold-dim:#9A7A3E;--gold-bg:rgba(198,151,75,.07);--gold-br:rgba(198,151,75,.25);
  --green:#34D399;--green-bg:rgba(52,211,153,.07);--green-br:rgba(52,211,153,.3);
  --red:#F87171;--red-bg:rgba(248,113,113,.07);--red-br:rgba(248,113,113,.3);
  --amber:#FBBF24;--amber-bg:rgba(251,191,36,.07);--amber-br:rgba(251,191,36,.3);
  --cyan:#22D3EE;--cyan-bg:rgba(34,211,238,.07);--cyan-br:rgba(34,211,238,.3);
  --text:#E8EAED;--text-2:#9CA3AF;--text-3:#6B7280;--text-4:#4B5563;
  --card:rgba(12,20,34,.85);--card-border:rgba(198,151,75,.1);
  --fd:'Tajawal','Noto Kufi Arabic',sans-serif;--fm:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--navy-900);color:var(--text);font-family:var(--fd);min-height:100vh;overflow-x:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:var(--navy-800);border-bottom:1px solid var(--card-border);position:sticky;top:0;z-index:50}
.topbar-brand{font-size:.85rem;font-weight:700;color:var(--gold);display:flex;align-items:center;gap:8px}
.topbar-brand .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.topbar-meta{display:flex;align-items:center;gap:12px;font-family:var(--fm);font-size:.65rem;color:var(--text-3)}
.topbar-clock{color:var(--gold-dim);font-weight:600}
main{max-width:900px;margin:0 auto;padding:16px 20px 90px}
.page-title{text-align:center;font-size:1.3rem;font-weight:800;color:var(--text);padding:20px 0 6px}
.page-title span{color:var(--gold)}
.page-sub{text-align:center;font-family:var(--fm);font-size:.6rem;color:var(--text-3);margin-bottom:16px}
.section{margin-bottom:14px}
.section-hdr{font-size:.72rem;font-weight:700;color:var(--gold-dim);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:14px 16px}
.insight-card{position:relative;overflow:hidden}
.insight-card::before{content:'';position:absolute;right:0;top:0;bottom:0;width:3px;border-radius:10px 0 0 10px}
.insight-card.lvl-info::before{background:var(--green)}
.insight-card.lvl-warning::before{background:var(--amber)}
.insight-card.lvl-alert::before{background:var(--red)}
.insight-icon{font-size:1.2rem;margin-left:8px}
.insight-text{font-size:.82rem;font-weight:700;color:var(--text);line-height:1.6}
.insight-sub{font-size:.68rem;color:var(--text-2);margin-top:4px;line-height:1.5}
.insight-meta{font-family:var(--fm);font-size:.55rem;color:var(--text-4);margin-top:6px}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat-chip{background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:12px 14px}
.stat-chip .sc-label{font-size:.6rem;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.stat-chip .sc-val{font-size:.9rem;font-weight:700;color:var(--text)}
.stat-chip .sc-sub{font-family:var(--fm);font-size:.55rem;color:var(--text-4);margin-top:2px}
.pri-list{display:flex;flex-direction:column;gap:6px}
.pri-item{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;background:var(--navy-700);border-radius:8px;border-right:3px solid var(--card-border)}
.pri-item.sev-high{border-right-color:var(--red)}
.pri-item.sev-medium{border-right-color:var(--amber)}
.pri-item.sev-low{border-right-color:var(--green)}
.pri-item .pi-domain{font-size:.5rem;padding:2px 6px;border-radius:4px;font-weight:600;background:var(--navy-600);color:var(--text-3);white-space:nowrap}
.pri-item .pi-body{flex:1}
.pri-item .pi-title{font-size:.72rem;font-weight:600;color:var(--text)}
.pri-item .pi-reason{font-size:.6rem;color:var(--text-3);margin-top:2px}
.pri-item .pi-score{font-family:var(--fm);font-size:.6rem;color:var(--gold);white-space:nowrap}
.empty{color:var(--text-4);font-size:.72rem;text-align:center;padding:16px}
.nav-bar{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;padding:12px 0}
.nav-link{font-size:.62rem;padding:5px 10px;border-radius:6px;color:var(--text-3);background:var(--navy-700);border:1px solid var(--card-border);cursor:pointer;transition:.2s;text-decoration:none}
.nav-link:hover,.nav-link.active{color:var(--gold);border-color:var(--gold-br);background:var(--gold-bg)}
.footer{text-align:center;font-family:var(--fm);font-size:.5rem;color:var(--text-4);padding:12px;border-top:1px solid var(--card-border);margin-top:20px}
@media(max-width:500px){main{padding:12px 14px 90px}}
</style>
<link rel="stylesheet" href="indicator-tooltips.css">
</head>
<body>
<div class="topbar">
  <div class="topbar-brand"><span class="dot" id="dot"></span>Master AI</div>
  <div class="topbar-meta"><span class="topbar-clock" id="clock">--:--</span></div>
</div>
<main>
<div class="page-title">&#x1F916; <span>&#x0627;&#x0644;&#x0645;&#x0633;&#x0627;&#x0639;&#x062F;</span></div>
<div class="page-sub" id="page-sub">--</div>
<div class="section">
  <div class="card insight-card lvl-info" id="insight-card">
    <div style="display:flex;align-items:flex-start">
      <span class="insight-icon" id="insight-icon">&#x1F916;</span>
      <div>
        <div class="insight-text" id="insight-text">&#x062C;&#x0627;&#x0631;&#x064A; &#x0627;&#x0644;&#x062A;&#x062D;&#x0645;&#x064A;&#x0644;...</div>
        <div class="insight-sub" id="insight-sub"></div>
        <div class="insight-meta" id="insight-meta"></div>
      </div>
    </div>
  </div>
</div>
<div class="section">
  <div class="section-hdr">&#x1F4CA; &#x0625;&#x062D;&#x0635;&#x0627;&#x0626;&#x064A;&#x0627;&#x062A;</div>
  <div class="stat-grid">
    <div class="stat-chip"><div class="sc-label">&#x0627;&#x0644;&#x0627;&#x0633;&#x062A;&#x0642;&#x0644;&#x0627;&#x0644;&#x064A;&#x0629;</div><div class="sc-val" id="s-auto">--</div></div>
    <div class="stat-chip"><div class="sc-label">&#x0627;&#x0644;&#x0637;&#x0644;&#x0628;&#x0627;&#x062A;</div><div class="sc-val" id="s-reqs">--</div><div class="sc-sub" id="s-cost">--</div></div>
    <div class="stat-chip"><div class="sc-label">&#x0627;&#x0644;&#x0630;&#x0627;&#x0643;&#x0631;&#x0629;</div><div class="sc-val" id="s-mem">--</div><div class="sc-sub" id="s-mem-sub">--</div></div>
    <div class="stat-chip"><div class="sc-label">&#x0627;&#x0644;&#x0625;&#x0635;&#x062F;&#x0627;&#x0631;</div><div class="sc-val" id="s-ver">--</div><div class="sc-sub" id="s-commits">--</div></div>
  </div>
</div>
<div class="section">
  <div class="section-hdr">&#x1F3AF; &#x0627;&#x0644;&#x0623;&#x0648;&#x0644;&#x0648;&#x064A;&#x0627;&#x062A;</div>
  <div class="pri-list" id="priorities"><div class="empty">&#x0644;&#x0627; &#x0623;&#x0648;&#x0644;&#x0648;&#x064A;&#x0627;&#x062A;</div></div>
</div>
<div class="section">
  <div class="section-hdr">&#x1F504; &#x0622;&#x062E;&#x0631; &#x0627;&#x0644;&#x062A;&#x062D;&#x062F;&#x064A;&#x062B;&#x0627;&#x062A;</div>
  <div class="pri-list" id="git-log"><div class="empty">&#x0644;&#x0627; &#x0628;&#x064A;&#x0627;&#x0646;&#x0627;&#x062A;</div></div>
</div>
<div class="nav-bar">

  <a class="nav-link" onclick="navTo('/trading/system')">&#x2699;&#xFE0F; &#x0627;&#x0644;&#x0646;&#x0638;&#x0627;&#x0645;</a>
    <a href="decisions" class="nav-link">القرارات</a>
    <a href="personality" class="nav-link">الشخصية</a>
</div>
</main>
<div class="footer" id="footer">&#x0622;&#x062E;&#x0631; &#x062A;&#x062D;&#x062F;&#x064A;&#x062B;: --</div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function navTo(p){window.location.href=p}
window.navTo=navTo;
function tickClock(){const now=new Date();const kwt=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Kuwait'}));$('clock').textContent=kwt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
setInterval(tickClock,1000);tickClock();
async function load(){
  let dash=null,ext=null;
  try{const [r1,r2]=await Promise.all([fetch('/dashboard').then(r=>r.ok?r.json():null).catch(()=>null),fetch('/dashboard/extended').then(r=>r.ok?r.json():null).catch(()=>null)]);dash=r1;ext=r2}catch(e){}
  $('dot').style.background=dash&&dash.api_online!==false?'var(--green)':'var(--red)';
  if(dash){
    const as=dash.assistant_surface||{},ta=as.top_action||{};
    const ic=$('insight-card');
    const sev=ta.urgency||ta.severity||'info';
    ic.className='card insight-card lvl-'+(sev==='high'||sev==='critical'?'alert':sev==='medium'?'warning':'info');
    const icons={trading:'\u{1F4C8}',calendar:'\u{1F4C5}',home:'\u{1F3E0}',email:'\u{1F4E7}',system:'\u2699\uFE0F'};
    $('insight-icon').textContent=icons[ta.domain]||'\u{1F916}';
    $('insight-text').textContent=ta.headline||dash.ai_insight||'\u2705 \u0643\u0644 \u0634\u064A \u062A\u0645\u0627\u0645';
    $('insight-sub').textContent=ta.recommendation||ta.why_now||'';
    $('insight-meta').textContent=ta.delay_cost?'\u23F1 '+ta.delay_cost:'';
    $('page-sub').textContent='\u0645\u0633\u062A\u0648\u0649 \u0627\u0644\u0627\u0633\u062A\u0642\u0644\u0627\u0644\u064A\u0629: '+(dash.autonomy_level||'standard');
    $('s-auto').textContent=dash.autonomy_level||'standard';
    $('s-ver').textContent=dash.version||'--';
    const pe=dash.priority_engine||{},pris=pe.priorities||[];
    if(pris.length){$('priorities').innerHTML=pris.map(p=>'<div class="pri-item sev-'+(p.severity||'low')+'"><span class="pi-domain">'+esc(p.domain||'')+'</span><div class="pi-body"><div class="pi-title">'+esc(p.title)+'</div><div class="pi-reason">'+esc(p.why_now||p.reason||'')+'</div></div><span class="pi-score">'+(p.priority_score||'')+'</span></div>').join('')}
  }
  if(ext){
    $('s-reqs').textContent=ext.total_requests||'--';
    $('s-cost').textContent='$'+(ext.cost_today_usd||0).toFixed(2)+' \u0627\u0644\u064A\u0648\u0645 \u00b7 $'+(ext.cost_total_usd||0).toFixed(2)+' \u0625\u062C\u0645\u0627\u0644\u064A';
    $('s-mem').textContent=(ext.memory_total||0)+' \u0630\u0627\u0643\u0631\u0629';
    const mt=ext.memory_by_type||{};
    $('s-mem-sub').textContent='\u062D\u0642\u0627\u0626\u0642: '+(mt.fact||0)+' \u00b7 \u0623\u062D\u062F\u0627\u062B: '+(mt.event||0)+' \u00b7 \u062A\u0641\u0636\u064A\u0644\u0627\u062A: '+(mt.preference||0);
    $('s-commits').textContent=(ext.git_commit_count||'--')+' commit \u00b7 '+esc(ext.git_branch||'main');
    if(ext.git_log&&ext.git_log.length){
      $('git-log').innerHTML=ext.git_log.slice(0,5).map(g=>'<div class="pri-item sev-low"><span class="pi-domain">git</span><div class="pi-body"><div class="pi-title" style="font-family:var(--fm);font-size:.62rem;direction:ltr">'+esc(g)+'</div></div></div>').join('');
    }
  }
  const now=new Date();const kwt=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Kuwait'}));
  $('footer').textContent='\u0622\u062E\u0631 \u062A\u062D\u062F\u064A\u062B: '+kwt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
load();setInterval(load,60000);
})();
</script>
