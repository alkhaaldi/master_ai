<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سوينق — بورصة الكويت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Noto+Kufi+Arabic:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#071528; --navy-800:#0B1E3A; --navy-700:#0F2A4F;
  --line:#1E3A5F; --line-soft:#182F4D;
  --gold:#C9A227; --gold-bright:#E3BE4A; --gold-dim:#8A7220;
  --txt:#E8EEF6; --txt-2:#A9BBD1; --txt-3:#6B819C;
  --up:#2FAE6E; --down:#E05252; --warn:#E8A33D;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(180deg,var(--navy-900),var(--navy-800) 40%);color:var(--txt);
     font-family:'Tajawal',system-ui,sans-serif;min-height:100vh;padding:14px;font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto}
h1,h2{font-family:'Noto Kufi Arabic',sans-serif;font-weight:700;letter-spacing:-.01em}
.m{font-family:'IBM Plex Mono',monospace;direction:ltr;display:inline-block;font-variant-numeric:tabular-nums}

.head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.head h1{font-size:22px;color:var(--gold)}
.head .sub{color:var(--txt-3);font-size:13px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-left:6px}
.dot.on{background:var(--up);box-shadow:0 0 8px var(--up)} .dot.off{background:var(--txt-3)}

/* بانر حالة البيانات */
.banner{border-radius:var(--r);padding:13px 18px;margin-bottom:14px;display:flex;align-items:center;
        gap:14px;flex-wrap:wrap;border:1px solid transparent;position:relative;overflow:hidden}
.banner::before{content:'';position:absolute;inset:0 auto 0 0;width:4px}
.banner .ic{font-size:20px;line-height:1}
.banner .main{flex:1;min-width:190px}
.banner .t{font-weight:700;font-size:15px;font-family:'Noto Kufi Arabic',sans-serif}
.banner .s{font-size:12.5px;opacity:.85;margin-top:1px}
.b-ok{background:rgba(47,174,110,.08);border-color:rgba(47,174,110,.32)} .b-ok::before{background:var(--up)}
.b-warn{background:rgba(232,163,61,.1);border-color:rgba(232,163,61,.4)} .b-warn::before{background:var(--warn)}
.b-bad{background:rgba(178,58,58,.13);border-color:rgba(224,82,82,.45)} .b-bad::before{background:var(--down)}
.chip{font-family:'IBM Plex Mono',monospace;direction:ltr;font-size:11.5px;background:rgba(0,0,0,.3);
      border:1px solid rgba(255,255,255,.12);padding:5px 10px;border-radius:8px;white-space:nowrap}
.btn{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#1A1206;border:0;
     border-radius:10px;padding:9px 18px;font-family:'Tajawal',sans-serif;font-weight:700;font-size:14px;
     cursor:pointer;white-space:nowrap;transition:.15s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:wait}

/* Pulse — أهم شي */
.pulse{background:linear-gradient(135deg,#14304f,#0d2340);border:1px solid rgba(201,162,39,.42);
       border-radius:var(--r);padding:18px 20px;margin-bottom:14px;display:flex;align-items:center;
       gap:18px;flex-wrap:wrap}
.pulse .lbl{color:var(--gold-dim);font-size:12px;letter-spacing:.04em;margin-bottom:4px}
.pulse .sym{font-family:'IBM Plex Mono',monospace;direction:ltr;font-size:30px;font-weight:600;color:var(--gold-bright)}
.pulse .co{color:var(--txt-2);font-size:13px}
.pulse .act{font-family:'Noto Kufi Arabic',sans-serif;font-size:19px;font-weight:700}
.pulse .score{font-family:'IBM Plex Mono',monospace;direction:ltr;font-size:34px;font-weight:600}
.pulse .none{color:var(--txt-3);font-size:15px;font-family:'Noto Kufi Arabic',sans-serif}
.grow{flex:1;min-width:10px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:14px}
.card{background:linear-gradient(160deg,var(--navy-700),var(--navy-800));border:1px solid var(--line);
      border-radius:var(--r);padding:15px}
.card .lbl{color:var(--txt-3);font-size:12px;margin-bottom:7px}
.card .val{font-family:'IBM Plex Mono',monospace;direction:ltr;font-size:26px;font-weight:600;line-height:1.15}
.card .note{font-size:11.5px;color:var(--txt-3);margin-top:5px}
.card.acc{border-color:rgba(201,162,39,.45);background:linear-gradient(160deg,#14304f,#0d2340)}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--txt-3)} .warn{color:var(--warn)}

/* شريط الاتجاه */
.tbar{display:flex;height:8px;border-radius:5px;overflow:hidden;margin-top:9px;background:#0a1c33}
.tbar i{display:block;height:100%}
.tbar .u{background:var(--up)} .tbar .d{background:var(--down)} .tbar .s{background:#3D5878}

.sec{background:rgba(11,30,58,.55);border:1px solid var(--line-soft);border-radius:var(--r);
     margin-bottom:14px;overflow:hidden}
.sec>h2{font-size:15px;padding:12px 16px;border-bottom:1px solid var(--line-soft);display:flex;
        align-items:center;gap:9px}
.sec>h2 .cnt{font-family:'IBM Plex Mono',monospace;direction:ltr;font-size:12px;color:var(--gold-dim);
             border:1px solid rgba(201,162,39,.28);border-radius:5px;padding:1px 7px}
.sec>h2 .src{margin-right:auto;font-size:11px;color:var(--txt-3);font-family:'IBM Plex Mono',monospace;
             direction:ltr;font-weight:400}
.sec .body{padding:12px 16px}

table{width:100%;border-collapse:collapse;font-size:14px}
th u{font-family:'IBM Plex Mono',monospace;direction:ltr;font-size:10px;color:var(--gold-dim);
     text-decoration:none;border:1px solid rgba(201,162,39,.28);border-radius:4px;padding:1px 5px;
     margin-right:4px;font-weight:500}
th{text-align:right;color:var(--txt-3);font-weight:500;font-size:12px;padding:9px 10px;
   border-bottom:1px solid var(--line-soft);white-space:nowrap}
td{padding:10px;border-bottom:1px solid rgba(24,47,77,.55);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{font-family:'IBM Plex Mono',monospace;direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
.sym{font-weight:700;color:var(--gold-bright);font-family:'IBM Plex Mono',monospace;direction:ltr}

/* ===== بطاقات الفرص — بديل جدول العشرة أعمدة ===== */
.opps{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:11px}
.opp{background:linear-gradient(160deg,rgba(15,42,79,.55),rgba(11,30,58,.55));
     border:1px solid var(--line-soft);border-radius:12px;padding:12px 13px}
.opp-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
       padding-bottom:9px;border-bottom:1px solid rgba(24,47,77,.6);margin-bottom:9px}
.opp-h .sym{font-size:16px}
.opp-h .co{font-size:11.5px;color:var(--txt-3);margin-top:2px;line-height:1.35}
.opp-a{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.opp-a .act{font-size:10.5px;font-family:'IBM Plex Mono',monospace;direction:ltr;
            color:var(--txt-2);background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.10);
            padding:2px 7px;border-radius:5px;white-space:nowrap}
.opp-g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 6px}
.opp-g>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.opp-g span{font-size:10.5px;color:var(--txt-3);white-space:nowrap}
.opp-g b{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.opp-t{margin-top:9px;padding-top:8px;border-top:1px solid rgba(24,47,77,.6)}
.miss{font-size:10.5px;color:var(--warn,#E8A33D);font-weight:600;white-space:nowrap}
.warnbar{background:rgba(232,163,61,.09);border:1px solid rgba(232,163,61,.34);
         border-radius:10px;padding:9px 12px;margin-bottom:11px;font-size:12.5px;
         color:var(--warn,#E8A33D);line-height:1.65}
@media(max-width:430px){
  .opps{grid-template-columns:1fr}
  .opp-g{grid-template-columns:repeat(2,1fr)}
}
.co{color:var(--txt-2);font-size:12.5px}

.score-pill{font-family:'IBM Plex Mono',monospace;direction:ltr;font-size:13px;font-weight:600;
            padding:3px 10px;border-radius:7px;display:inline-block}
.sc-hi{background:rgba(47,174,110,.18);color:#6EDCA5;border:1px solid rgba(47,174,110,.4)}
.sc-mid{background:rgba(232,163,61,.15);color:#F0C075;border:1px solid rgba(232,163,61,.35)}
.sc-lo{background:rgba(107,129,156,.15);color:var(--txt-2);border:1px solid var(--line)}

.tag{font-size:11px;padding:2px 8px;border-radius:6px;display:inline-block;margin:2px 3px 2px 0;
     font-family:'Tajawal',sans-serif}
.tag.f{background:rgba(47,174,110,.12);color:#7FD9AC;border:1px solid rgba(47,174,110,.28)}
.tag.b{background:rgba(224,82,82,.12);color:#F09292;border:1px solid rgba(224,82,82,.28)}
.pill{font-size:11px;padding:3px 9px;border-radius:20px;font-family:'IBM Plex Mono',monospace;direction:ltr;display:inline-block}
.p-live{background:rgba(47,174,110,.16);color:#6EDCA5;border:1px solid rgba(47,174,110,.35)}
.p-stale{background:rgba(232,163,61,.16);color:#F0C075;border:1px solid rgba(232,163,61,.35)}
.p-missing{background:rgba(224,82,82,.16);color:#F09292;border:1px solid rgba(224,82,82,.35)}

.empty{padding:30px 20px;text-align:center;color:var(--txt-3)}
.empty .big{font-size:15.5px;color:var(--txt-2);margin-bottom:5px;font-family:'Noto Kufi Arabic',sans-serif}
.empty .why{font-size:13px;max-width:440px;margin:0 auto}

details.diag{background:rgba(7,21,40,.6);border:1px solid var(--line-soft);border-radius:var(--r)}
details.diag>summary{padding:12px 16px;cursor:pointer;font-size:13px;color:var(--txt-2);list-style:none}
details.diag>summary::-webkit-details-marker{display:none}
details.diag>summary::before{content:'▾ ';color:var(--gold-dim)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;padding:2px 16px 14px;font-size:12px}
.kv dt{color:var(--txt-3);font-family:'IBM Plex Mono',monospace;direction:ltr}
.kv dd{font-family:'IBM Plex Mono',monospace;direction:ltr;color:var(--txt-2);word-break:break-all}
.flags{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 14px}
.flag{font-size:10.5px;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.05);
      border:1px solid var(--line-soft);color:var(--txt-3);font-family:'IBM Plex Mono',monospace;direction:ltr}
.flag.on{color:#6EDCA5;border-color:rgba(47,174,110,.3)}
.foot{text-align:center;color:var(--txt-3);font-size:12px;padding:14px 0 8px}
@media(max-width:640px){
  body{padding:10px;font-size:14px}
  .card .val{font-size:22px} .pulse .sym{font-size:25px} .pulse .score{font-size:28px}
  th,td{padding:8px 6px;font-size:13px}
  .hs{display:none}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <h1>سوينق — بورصة الكويت</h1>
    <span class="sub" id="mkt">…</span>
  </div>

  <div class="banner b-bad" id="banner">
    <span class="ic" id="b-ic">…</span>
    <div class="main"><div class="t" id="b-t">جارٍ التحميل</div><div class="s" id="b-s">—</div></div>
    <span class="chip" id="b-chip" hidden></span>
    <button class="btn" id="refresh">تحديث الآن</button>
  </div>

  <div id="pulse"></div>
  <div class="cards" id="cards"></div>

  <div class="sec">
    <h2>المراكز المفتوحة <span class="cnt" id="pos-n">0</span></h2>
    <div class="body" id="positions"></div>
  </div>

  <div class="sec">
    <h2>الفرص <span class="cnt" id="opp-n">0</span><span class="src" id="opp-src"></span></h2>
    <div class="body" id="opps"></div>
  </div>

  <div class="sec">
    <h2>قائمة المراقبة <span class="cnt" id="wl-n">0</span></h2>
    <div class="body" id="watch"></div>
  </div>

  <details class="diag">
    <summary>تشخيص</summary>
    <dl class="kv" id="diag"></dl>
    <div class="flags" id="flags"></div>
  </details>

  <div class="foot" id="foot">—</div>
</div>

<script>
'use strict';
/* ── الإعداد ───────────────────────────────────────────────
   الصفحة تُخدَّم من خادم Master AI نفسه:
     محلياً   http://192.168.109.123:9000/trading/swing.html
     تونلاً   https://ai.salem-home.com/trading/swing
   في الحالتين الـ endpoint على نفس الأصل → مسار نسبي.
   الاستثناء الوحيد: لو خُدّمت من HA (المنفذ 8123) — عندها
   نحتاج عنواناً صريحاً. ولا نستخدم عنواناً مطلقاً بـ http
   مع صفحة https، لأن المتصفح يحظره (mixed content).        */
const API_BASE = 'http://192.168.109.123:9000';   // يُستخدم فقط إن خُدّمت من 8123
const FROM_HA  = location.port === '8123';
const API = (location.protocol === 'file:') ? null
          : (FROM_HA ? API_BASE : '') + '/dashboard/swing';
const AUTO_MS = 0;                       // 0 = يدوي. فعّلها 60000 لو تبي تحديثاً تلقائياً

const $ = id => document.getElementById(id);
const has = v => v !== null && v !== undefined && v !== '';
const fils = v => has(v) ? Number(v).toLocaleString('en-US',{maximumFractionDigits:1}) : '—';
const num  = v => has(v) ? Number(v).toLocaleString('en-US') : '—';
// فلس × سهم ÷ 1000 = دينار
const kwd = v => { if(!has(v)) return '—'; const d = Number(v)/1000;
  return Math.abs(d) >= 1000 ? d.toLocaleString('en-US',{maximumFractionDigits:0})
                             : d.toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3}); };
const kwdRaw = v => has(v) ? Number(v).toLocaleString('en-US',{maximumFractionDigits:0}) : '—';
const AR_M = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function arDate(iso){ if(!iso) return null; const d=new Date(iso); if(isNaN(d)) return null;
  return `${d.getDate()} ${AR_M[d.getMonth()]} ${d.getFullYear()}`; }

/* الحالة الخماسية — من الباك اند، وإلا اشتقاق احتياطي */
const UI = {
  normal:   {c:'b-ok',   ic:'●', t:'البيانات سليمة'},
  live:     {c:'b-ok',   ic:'●', t:'البيانات حيّة'},
  degraded: {c:'b-warn', ic:'▲', t:'السوق مفتوح وآخر بيانات من جلسة سابقة'},
  broken:   {c:'b-bad',  ic:'■', t:'البيانات معطّلة'},
  blind:    {c:'b-bad',  ic:'✕', t:'لا بيانات — الصفحة لا تعكس السوق'}
};
function resolveState(d){
  /* as_of, لا data_as_of — الحمولة لم تشحن هذا الاسم يوماً، فكان الحقل
     undefined دائماً والصفحة عمياء عن ختمها الزمني. */
  if(d.data_state) return {st:d.data_state, ar:d.data_state_ar, sess:d.data_sessions_old,
                           as_of:d.as_of, delay:d.source_delay_minutes, age:d.as_of_age_minutes};
  /* الاحتياطي كان يقرأ d.bridge_online، وقد أُزيل من الحمولة (متقاعد لا
     معطّل). وكان ينتهي بـ return {st:'live'} — أي أن غياب العقد كان
     يُنتج ادعاء «حيّ» بلا أي دليل، وهو أسوأ ما يمكن أن يقوله احتياطي.
     الآن: لا عقد يعني لا ادعاء. */
  return {st:'blind', ar:'الحمولة لا تحمل data_state — لا تُقرأ الأرقام أدناه كحالة سوق'};
}
const isGood = s => s === 'normal' || s === 'live';

function render(d){
  const S = resolveState(d), u = UI[S.st] || UI.blind, ok = isGood(S.st);

  $('banner').className = 'banner ' + u.c;
  $('b-ic').textContent = u.ic;
  /* «حيّ» وحدها تدّعي ما لا تسنده التغذية. القياس على السلك (17 أغسطس،
     18 عيّنة) أعطى أرضية 15.1 دقيقة لم تُخترق مرة. فالوسم يحمل الأرضية،
     والسطر تحته يحمل العمر الفعلي — وهما رقمان مختلفان: الأرضية ما لا
     يستطيع المصدر تجاوزه، والعمر ما نملكه نحن الآن. الوسم على «حيّ» وحدها:
     بعد الإغلاق الرقم نهائي ولا يدّعي حضوراً، فالتأخير هناك ضجيج. */
  $('b-t').textContent  = u.t + (S.st === 'live' && has(S.delay) ? ` (تغذية متأخرة ${S.delay} دقيقة)` : '');
  const ageTxt = has(S.age) ? `آخر تداول عند المصدر قبل ${Math.round(S.age)} دقيقة` : '';
  $('b-s').textContent  = [S.ar || '', ageTxt].filter(Boolean).join(' · ');
  const chip = $('b-chip');
  if(has(S.sess)){ chip.hidden=false;
    chip.textContent = Number(S.sess)===0 ? 'آخر جلسة' : `${S.sess} جلسة`; }
  else chip.hidden = true;

  const open = d.market_open ?? (d.market_status === 'open');
  $('mkt').innerHTML = `<span class="dot ${open?'on':'off'}"></span>` +
    (open ? 'السوق مفتوح' : 'السوق مغلق') +
    (d.scan_time ? ` · آخر مسح <span class="m">${String(d.scan_time).slice(11,16)}</span>` : '');

  /* ── Pulse: أهم إشارة ── */
  const ts = d.top_signal;
  if(ok && ts){
    /* نفس سلسلة الأسماء المستعملة في البطاقات والمراقبة. وكان `?? 0` هنا
       يحوّل الدرجة الغائبة إلى صفر، فتُلوَّن البطاقة muted وتُقرأ «درجة صفر»
       بدل «لم تصل». الغياب null، ويُقال. */
    const scRawT = ts.confluence_pct ?? ts.score ?? ts.confluence_score;
    const sc = has(scRawT) ? Number(scRawT) : null;
    const tone = s => s === null ? 'muted' : (s>=70?'up':s>=50?'warn':'muted');
    $('pulse').innerHTML = `<div class="pulse">
      <div><div class="lbl">أقوى إشارة</div>
        <div class="sym">${ts.symbol||'—'}</div>
        ${(ts.name||ts.name_ar)?`<div class="co">${ts.name||ts.name_ar}</div>`:''}</div>
      <div class="grow"></div>
      <div style="text-align:center"><div class="lbl">القرار</div>
        <div class="act ${tone(sc)}">${ts.action||ts.direction||'—'}</div></div>
      <div style="text-align:center"><div class="lbl">الدرجة</div>
        <div class="score ${tone(sc)}">${sc === null ? 'غير محسوبة' : sc}</div></div>
      ${has(ts.price)?`<div style="text-align:center"><div class="lbl">السعر <span class="m">فلس</span></div>
        <div class="score" style="font-size:24px">${fils(ts.price)}</div></div>`:''}
    </div>`;
  } else {
    $('pulse').innerHTML = `<div class="pulse"><div class="none">${
      ok ? 'لا إشارة تجتاز الشروط اليوم' : 'لا تُقيَّم الإشارات — مصدر البيانات غير سليم'}</div></div>`;
  }

  /* ── البطاقات ── */
  const st = d.stats || {}, cov = d.coverage || {};
  const scanned = st.total_scanned ?? st.scanned ?? cov.scanned ?? 0;
  const universe = cov.universe ?? st.universe ?? null;
  const tr = d.market_trend || {};
  const U = tr.up ?? tr.UP ?? 0, D = tr.down ?? tr.DOWN ?? 0, W = tr.sideways ?? tr.SIDEWAYS ?? 0;
  const tot = (U+D+W) || 1;
  const pos = d.active_positions || d.open_positions || [];
  const opps = d.opportunities || [];
  const wl = d.watchlist || [];

  const cards = [];
  cards.push(`<div class="card"><div class="lbl">التغطية</div>
    <div class="val ${scanned?'':'down'}">${universe?`${scanned}/${universe}`:scanned}</div>
    <div class="note">${scanned?'سهم بسعر صالح':'لم يُمسح أي سهم'}</div></div>`);

  // القاعدة: لا يُعرض الـ regime إلا إذا كانت البيانات سليمة
  if(ok && d.market_regime){
    const r = d.market_regime;
    cards.push(`<div class="card"><div class="lbl">اتجاه السوق</div>
      <div class="val" style="font-size:21px">${r.regime ?? r}</div>
      <div class="note">${r.reason||''}</div>
      <div class="tbar"><i class="u" style="width:${U/tot*100}%"></i><i class="d" style="width:${D/tot*100}%"></i><i class="s" style="width:${W/tot*100}%"></i></div>
      <div class="note"><span class="up">${U} صاعد</span> · <span class="down">${D} هابط</span> · ${W} عرضي</div>
    </div>`);
  } else {
    cards.push(`<div class="card"><div class="lbl">اتجاه السوق</div>
      <div class="val muted" style="font-size:21px">غير معروف</div>
      <div class="note">لا يُحسب من بيانات غير سليمة</div></div>`);
  }

  cards.push(`<div class="card"><div class="lbl">الفرص</div>
    <div class="val ${ok?'':'muted'}">${ok?opps.length:'—'}</div>
    <div class="note">${ok?`و ${wl.length} تحت المراقبة`:'لا تُقيَّم بلا بيانات'}</div></div>`);

  const totVal = pos.reduce((a,p)=>{const q=p.quantity??p.qty,c=p.current_price??p.entry;
    return a + ((has(q)&&has(c))? q*c : 0);},0);
  cards.push(`<div class="card acc"><div class="lbl">المراكز</div>
    <div class="val">${pos.length}</div>
    <div class="note">${totVal?`${kwd(totVal)} د.ك`:'—'}</div></div>`);
  $('cards').innerHTML = cards.join('');

  /* ── المراكز — تُعرض في كل الحالات ── */
  $('pos-n').textContent = pos.length;
  $('positions').innerHTML = pos.length ? posTable(pos)
    : `<div class="empty"><div class="big">لا مراكز مفتوحة</div></div>`;

  /* ── الفرص ── */
  $('opp-n').textContent = ok ? opps.length : 0;
  $('opp-src').textContent = S.st;
  $('opps').innerHTML = oppsBlock(S, opps);

  /* ── المراقبة ── */
  $('wl-n').textContent = ok ? wl.length : 0;
  $('watch').innerHTML = (ok && wl.length) ? watchTable(wl)
    : `<div class="empty"><div class="big">${ok?'لا شيء تحت المراقبة':'—'}</div></div>`;

  /* ── تشخيص ── */
  const diag = {
    data_state: S.st, data_state_ar: S.ar || '—', sessions_old: S.sess ?? '—',
    market_open: String(open), coverage: universe?`${scanned}/${universe}`:scanned,
    opportunities: opps.length, watchlist: wl.length,
    filtered_out: st.filtered_out ?? '—',
    source: d.source || '—', source_state: d.source_state || '—',
    source_delay_minutes: d.source_delay_minutes ?? '—',
    as_of: d.as_of || '—', as_of_kind: d.as_of_kind || '—',
    as_of_age_minutes: d.as_of_age_minutes ?? '—',
    scan_time: d.scan_time || '—',
    fetched_at: new Date().toISOString().slice(0,19)+'Z'
  };
  $('diag').innerHTML = Object.entries(diag).map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('');
  $('flags').innerHTML = Object.entries(d.flags||{})
    .map(([k,v])=>`<span class="flag ${v?'on':''}">${k}${v?' ✓':''}</span>`).join('');
  if(!ok) document.querySelector('details.diag').open = true;

  $('foot').textContent = 'آخر جلب: ' + new Date().toLocaleTimeString('ar-KW');
}

function scoreCls(s){ return s>=70?'sc-hi':s>=50?'sc-mid':'sc-lo'; }

function posTable(rows){
  const body = rows.map(p=>{
    const sym=p.symbol||p.sym||'—', entry=p.entry??p.entry_price??p.avg_price;
    const cur=p.current_price??p.current, pstate=p.price_state||(has(cur)?'live':'missing');
    /* كان `p.pnl_valid !== false` — أي أن غياب الراية يمر كصحيح. والحمولة
       لم تكن تشحنها أصلاً من هذا الباني، فكل مركز كان يُعرض «صالحاً» بلا
       شيء يؤكد ذلك. الغياب الآن يُقرأ باطلاً: من يعرض ربحاً عليه أن يقوله. */
    const valid = p.pnl_valid === true && has(cur) && pstate==='live';
    const qty=p.quantity??p.qty;

    let pnl;
    if(valid){
      const pct = has(p.pnl_pct)?Number(p.pnl_pct):((cur-entry)/entry*100);
      pnl = `<td class="n ${pct>=0?'up':'down'}">${pct>=0?'+':''}${pct.toFixed(2)}%
        ${(has(qty))?`<div style="font-size:11px;color:var(--txt-3)">${kwd(qty*(cur-entry))} د.ك</div>`:''}</td>`;
    } else {
      const lk=p.last_known_price??cur, when=p.price_as_of||p.as_of;
      pnl = `<td class="n muted">—<div style="font-size:11px;margin-top:3px">آخر سعر ${fils(lk)}${when?' · '+arDate(when):''}</div></td>`;
    }
    const stop = has(p.trailing_stop??p.stop_loss)
      ? `<td class="n">${fils(p.trailing_stop??p.stop_loss)}${p.stop_source?`<div style="font-size:11px;color:var(--txt-3)">${p.stop_source}</div>`:''}</td>`
      : `<td class="n down" title="مركز بلا وقف">بلا وقف ⚠</td>`;
    const cap = has(p.max_position_kwd)
      ? `<td class="n hs">${kwdRaw(p.max_position_kwd)}<div style="font-size:11px;color:var(--txt-3)">السقف</div></td>`
      : `<td class="n hs muted">—</td>`;

    return `<tr>
      <td><span class="sym">${sym}</span>${(p.name||p.name_ar)?`<div class="co">${p.name||p.name_ar}</div>`:''}
        ${p.daily_trend?`<div class="co" style="font-size:11.5px">اتجاه يومي: ${p.daily_trend}</div>`:''}</td>
      <td class="n">${fils(entry)}</td>
      <td class="n">${valid?fils(cur):'<span class="muted">—</span>'}</td>
      ${pnl}${stop}
      <td class="n hs">${num(qty)}</td>
      <td class="n">${(has(qty)&&has(valid?cur:entry))?kwd(qty*(valid?cur:entry)):'—'}</td>
      ${cap}
      <td><span class="pill p-${pstate}">${pstate}</span></td>
    </tr>`;
  }).join('');

  return `<table><thead><tr>
    <th>السهم</th><th>الدخول <u>فلس</u></th><th>الحالي <u>فلس</u></th><th>الربح/الخسارة</th>
    <th>الوقف <u>فلس</u></th><th class="hs">الكمية <u>سهم</u></th><th>القيمة <u>د.ك</u></th>
    <th class="hs">أقصى مركز <u>د.ك</u></th><th>السعر</th>
  </tr></thead><tbody>${body}</tbody></table>`;
}

function tags(v, cls){
  if(!v) return '';
  const arr = Array.isArray(v) ? v : String(v).split(/[,،]/);
  return arr.filter(Boolean).map(x=>`<span class="tag ${cls}">${String(x).trim()}</span>`).join('');
}

function oppsBlock(S, opps){
  if(!isGood(S.st)){
    return `<div class="empty"><div class="big">لا يمكن تقييم الفرص</div>
      <div class="why">مصدر الأسعار غير سليم${has(S.sess)?` — آخر بيانات عمرها ${S.sess} جلسة`:''}.
      هذا ليس غياب فرص، بل غياب بيانات.</div></div>`;
  }
  if(!opps.length){
    return `<div class="empty"><div class="big">لا فرص مطابقة للشروط اليوم</div>
      <div class="why">البيانات سليمة والمسح تمّ — ولم يجتز أي سهم الشروط.</div></div>`;
  }
  /* بطاقة لكل فرصة بدل جدول بعشرة أعمدة — الجدول كان يزدحم داخل
     إطار HA فيلتصق رأسه بأول صف. والبطاقة تُظهر الحقل الغائب غياباً
     بدل أن تتركه شرطة في خانة ضيقة. */
  const cards = opps.map(o=>{
    /* الحمولة تشحن confluence_pct — لا confluence_score ولا score. فالخانة
       كانت شرطة في 18 فرصة من 18، وعدّاد missScore أدناه يقولها منذ fd6ef7e
       ولم يقرأه أحد. الاسم المشحون أولاً، والقديمان احتياطاً لحمولة مخزَّنة.
       (وconfluence_score في القاعدة مقياسان بنفس الاسم — راجع SCALES.md —
        وهذا سبب إضافي لعدم طلبه بالاسم من هنا.) */
    const scRaw = o.confluence_pct ?? o.confluence_score ?? o.score;
    const sc    = has(scRaw) ? Number(scRaw) : null;
    const stop  = o.stop ?? o.stop_loss;
    const tgt   = o.target ?? o.target_1;
    const price = o.price;

    const scoreHtml = sc === null
      ? `<span class="miss" title="لم يصل مع الحمولة">الدرجة غير محسوبة</span>`
      : `<span class="score-pill ${scoreCls(sc)}">${sc}</span>`;

    const stopHtml = has(stop)
      ? `<b class="n">${fils(stop)}</b>`
      : `<b class="miss">لم يُحدَّد</b>`;

    const rr = (has(stop) && has(tgt) && has(price) && Number(price) > Number(stop))
      ? (Math.abs(Number(tgt)-Number(price)) / Math.abs(Number(price)-Number(stop))).toFixed(2)
      : null;

    return `<div class="opp">
      <div class="opp-h">
        <div>
          <span class="sym">${o.symbol||'—'}</span>
          ${(o.name||o.name_ar)?`<div class="co">${o.name||o.name_ar}</div>`:''}
        </div>
        <div class="opp-a">
          ${scoreHtml}
          <span class="act">${o.action||o.direction||'—'}</span>
        </div>
      </div>
      <div class="opp-g">
        <div><span>السعر</span><b class="n">${fils(price)}</b></div>
        <div><span>الوقف</span>${stopHtml}</div>
        <div><span>الهدف</span><b class="n">${fils(tgt)}</b></div>
        <div><span>R/R</span><b class="n">${rr ?? '—'}</b></div>
        <div><span>RSI</span><b class="n">${(()=>{const r=o.rsi_14??o.rsi;return has(r)?Number(r).toFixed(0):'—';})()}</b></div>
        <div><span>ADX</span><b class="n">${has(o.adx)?Number(o.adx).toFixed(0):'—'}</b></div>
        <div><span>الحجم</span><b class="n">${has(o.vol_ratio)?Number(o.vol_ratio).toFixed(1)+'×':'—'}</b></div>
        <div><span>أقصى مركز</span><b class="n">${kwdRaw(o.max_position_kwd)}</b></div>
      </div>
      ${(o.factors||o.reasons||o.blockers)?`<div class="opp-t">${tags(o.factors||o.reasons,'f')}${tags(o.blockers,'b')}</div>`:''}
    </div>`;
  }).join('');

  /* نفس سلسلة الأسماء المستعملة في البطاقة أعلاه. عدّاد يبحث عن اسم لا
     تشحنه الحمولة يقول «18 من 18 ناقصة» إلى الأبد — أحمر عالق، وهو ما كان. */
  const missScore = opps.filter(o=>!has(o.confluence_pct ?? o.confluence_score ?? o.score)).length;
  const missStop  = opps.filter(o=>!has(o.stop ?? o.stop_loss)).length;
  let note = '';
  if(missScore || missStop){
    const bits = [];
    if(missScore) bits.push(`${missScore} بلا درجة`);
    if(missStop)  bits.push(`${missStop} بلا وقف`);
    note = `<div class="warnbar">الحمولة ناقصة: ${bits.join(' · ')} من ${opps.length}.
      الترتيب أدناه لا يستند إلى درجة، والوقف غير المحدَّد يعني أنه يُحسب عندك لا عندنا.</div>`;
  }
  return note + `<div class="opps">${cards}</div>`;
}

function watchTable(rows){
  const body = rows.map(w=>{
    /* نفس سلسلة الأسماء المستعملة في بطاقات الفرص — الحمولة تشحن
       confluence_pct و name_ar، لا confluence_score و name. */
    const scRawW = w.confluence_pct ?? w.confluence_score ?? w.score;
    const sc = has(scRawW) ? Number(scRawW) : null;
    return `<tr>
      <td><span class="sym">${w.symbol||'—'}</span>${(w.name||w.name_ar)?`<div class="co">${w.name||w.name_ar}</div>`:''}</td>
      <td class="n">${sc === null
        ? `<span class="miss" title="لم تصل مع الحمولة">غير محسوبة</span>`
        : `<span class="score-pill ${scoreCls(sc)}">${sc}</span>`}</td>
      <td class="n">${fils(w.price)}</td>
      <td>${tags(w.factors||w.reasons,'f')}</td>
      <td>${tags(w.blockers,'b') || '<span class="muted" style="font-size:12px">—</span>'}</td>
    </tr>`;
  }).join('');
  return `<div style="font-size:12.5px;color:var(--txt-3);margin-bottom:9px">
      مرشّحون لم يجتازوا كل الشروط — الحواجب مذكورة صراحةً، ولا يُعرض لهم دخول ولا هدف.
    </div>
    <table><thead><tr>
      <th>السهم</th><th>الدرجة</th><th>السعر <u>فلس</u></th><th>العوامل</th><th>الحواجب</th>
    </tr></thead><tbody>${body}</tbody></table>`;
}

async function load(){
  const b=$('refresh'); b.disabled=true; b.textContent='جارٍ…';
  try{
    if(!API){ render(DEMO); return; }
    const r = await fetch(API+'?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    render(await r.json());
  }catch(e){
    $('banner').className='banner b-bad'; $('b-ic').textContent='✕';
    $('b-t').textContent='تعذّر جلب البيانات'; $('b-s').textContent=String(e.message||e);
    $('b-chip').hidden=true;
  }finally{ b.disabled=false; b.textContent='تحديث الآن'; }
}
