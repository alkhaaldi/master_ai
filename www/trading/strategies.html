<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>&#1575;&#1604;&#1575;&#1587;&#1578;&#1585;&#1575;&#1578;&#1610;&#1580;&#1610;&#1575;&#1578; &#1575;&#1604;&#1605;&#1603;&#1578;&#1588;&#1601;&#1577; &#x2014; KSE</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--n9:#070D17;--n8:#0C1525;--n7:#111E32;--n6:#162840;--n5:#1C334F;--gold:#C6974B;--gold-b:#D4A95C;--gold-bg:rgba(198,151,75,.06);--gold-br:rgba(198,151,75,.25);--grn:#4CAF82;--grn-bg:rgba(76,175,130,.08);--grn-br:rgba(76,175,130,.3);--red:#D94452;--red-bg:rgba(217,68,82,.08);--red-br:rgba(217,68,82,.3);--amb:#E8A838;--amb-bg:rgba(232,168,56,.08);--amb-br:rgba(232,168,56,.3);--cyn:#38BDF8;--cyn-bg:rgba(56,189,248,.08);--cyn-br:rgba(56,189,248,.3);--t:#E8ECF0;--t2:#A0ADBC;--t3:#6B7D90;--t4:#405060;--card:#0E1929;--card-h:#132137;--cb:#1A2E45;--f:'Tajawal','Noto Kufi Arabic',sans-serif;--fd:'Noto Kufi Arabic','Tajawal',sans-serif;--fm:'IBM Plex Mono',monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--n9);color:var(--t);min-height:100vh;-webkit-font-smoothing:antialiased}
.ltr{direction:ltr;unicode-bidi:isolate}
</style>
</head>
<body>
<style>
.topbar{position:sticky;top:0;z-index:100;background:rgba(7,13,23,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--cb);padding:0 1.25rem;height:56px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:.75rem}
.brand-m{background:linear-gradient(135deg,var(--gold),#9E7A3D);color:var(--n9);font-family:var(--fm);font-weight:700;font-size:.85rem;padding:.25rem .6rem;border-radius:4px}
.brand-t{font-family:var(--fd);font-weight:700;font-size:1rem}
.nav{display:flex;gap:.15rem}
.nav a{font-size:.75rem;padding:.3rem .6rem;border-radius:6px;color:var(--t3);text-decoration:none;transition:.2s}
.nav a:hover{color:var(--t);background:var(--n7)}
.nav a.on{color:var(--gold);background:var(--gold-bg);border:1px solid var(--gold-br)}
.clock{font-family:var(--fm);font-size:.85rem;color:var(--gold);direction:ltr}
</style>
<style>
.pulse{margin:1.25rem;background:linear-gradient(135deg,rgba(198,151,75,.08),rgba(198,151,75,.02));border:1px solid var(--gold-br);border-radius:14px;padding:1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.pulse-icon{font-size:2.5rem;animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.4)}}
.pulse-main{flex:1;min-width:200px}
.pulse-title{font-family:var(--fd);font-size:1.3rem;font-weight:700;color:var(--gold)}
.pulse-sub{font-size:.82rem;color:var(--t2);margin-top:.25rem}
.pulse-stats{display:flex;gap:1.5rem;flex-wrap:wrap}
.ps{text-align:center}.ps-v{font-family:var(--fm);font-size:1.6rem;font-weight:700}.ps-l{font-size:.68rem;color:var(--t3)}
.seg-bar{display:flex;gap:.5rem;margin:1.25rem;flex-wrap:wrap}
.seg{background:var(--card);border:1px solid var(--cb);border-radius:10px;padding:.6rem 1rem;flex:1;min-width:130px;text-align:center;cursor:pointer;transition:.2s}
.seg:hover,.seg.on{border-color:var(--gold-br);background:var(--gold-bg)}
.seg-tf{font-family:var(--fm);font-size:.9rem;font-weight:700;color:var(--gold)}
.seg-reg{font-size:.72rem;color:var(--t2)}
.seg-cnt{font-family:var(--fm);font-size:1.1rem;font-weight:700;color:var(--t);margin-top:.2rem}
.seg-ev{font-size:.68rem;color:var(--grn)}
.filter-bar{display:flex;gap:.5rem;flex-wrap:wrap;margin:0 1.25rem 1rem;align-items:center}
.filter-btn{font-size:.75rem;padding:.35rem .75rem;border-radius:8px;border:1px solid var(--cb);background:var(--n8);color:var(--t3);cursor:pointer;transition:.2s}
.filter-btn:hover,.filter-btn.on{color:var(--gold);border-color:var(--gold-br);background:var(--gold-bg)}
</style>
<style>
.main{padding:0 1.25rem 2rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:1rem;margin-top:.5rem}
.s-card{background:var(--card);border:1px solid var(--cb);border-radius:12px;overflow:hidden;transition:border-color .2s,transform .15s}
.s-card:hover{border-color:var(--gold-br);transform:translateY(-2px)}
.s-card.top3{border-color:var(--gold-br);box-shadow:0 0 24px rgba(198,151,75,.1)}
.s-head{padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--cb)}
.s-rank{font-family:var(--fm);font-size:1rem;font-weight:700;color:var(--gold);background:var(--gold-bg);border:1px solid var(--gold-br);padding:2px 10px;border-radius:8px}
.s-tags{display:flex;gap:.3rem;flex-wrap:wrap}
.s-tag{font-size:.65rem;padding:2px 7px;border-radius:6px;font-weight:600}
.s-tag.tf{color:var(--cyn);background:var(--cyn-bg);border:1px solid var(--cyn-br)}
.s-tag.reg{color:var(--amb);background:var(--amb-bg);border:1px solid var(--amb-br)}
.s-body{padding:1rem}
.s-pattern{background:var(--n8);border-radius:8px;padding:.6rem .8rem;margin-bottom:.75rem;font-size:.85rem;color:var(--cyn);line-height:1.7;font-weight:600}
.s-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-bottom:.75rem}
.sm{text-align:center;background:var(--n8);border-radius:6px;padding:.35rem .2rem}
.sm-v{font-family:var(--fm);font-size:.9rem;font-weight:700}
.sm-l{font-size:.6rem;color:var(--t3)}
.s-plan{border:1px solid var(--grn-br);background:var(--grn-bg);border-radius:10px;padding:.75rem;margin-bottom:.5rem}
.s-plan-title{font-size:.72rem;color:var(--grn);font-weight:700;margin-bottom:.5rem;display:flex;align-items:center;gap:.3rem}
.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.3rem}
.pg{text-align:center}
.pg-v{font-family:var(--fm);font-size:.85rem;font-weight:700}
.pg-l{font-size:.58rem;color:var(--t3)}
.s-valid{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.sv{font-size:.68rem;padding:2px 8px;border-radius:6px;background:var(--n8);color:var(--t3)}
.sv.good{color:var(--grn);background:var(--grn-bg)}
.sv.warn{color:var(--amb);background:var(--amb-bg)}
.wf-bar{display:flex;gap:2px;height:16px;margin-top:.3rem}
.wf-seg{flex:1;border-radius:3px;position:relative}
.wf-seg.pos{background:var(--grn-bg);border:1px solid var(--grn-br)}
.wf-seg.neg{background:var(--red-bg);border:1px solid var(--red-br)}
.wf-seg.none{background:var(--n7)}
.loading{display:flex;align-items:center;justify-content:center;padding:4rem;gap:1rem}
.spinner{width:36px;height:36px;border:3px solid var(--n6);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;padding:1.5rem;font-size:.65rem;color:var(--t4);border-top:1px solid var(--cb);margin-top:2rem}
@media(max-width:768px){.cards{grid-template-columns:1fr}.s-metrics{grid-template-columns:repeat(2,1fr)}.plan-grid{grid-template-columns:repeat(2,1fr)}.seg-bar{flex-direction:column}.nav{display:none}}
</style>

<header class="topbar">
  <div class="brand"><span class="brand-m">KSE</span><span class="brand-t">&#1575;&#1604;&#1575;&#1587;&#1578;&#1585;&#1575;&#1578;&#1610;&#1580;&#1610;&#1575;&#1578; &#1575;&#1604;&#1605;&#1603;&#1578;&#1588;&#1601;&#1577;</span></div>
  <nav class="nav">
    <a href="decisions">&#1575;&#1604;&#1602;&#1585;&#1575;&#1585;&#1575;&#1578;</a>
    <a href="positions">&#1575;&#1604;&#1605;&#1585;&#1575;&#1603;&#1586;</a>
    <a href="radar">&#1575;&#1604;&#1585;&#1575;&#1583;&#1575;&#1585;</a>
    <a href="journal">&#1575;&#1604;&#1587;&#1580;&#1604;</a>
    <a href="strategies" class="on">&#1575;&#1604;&#1575;&#1587;&#1578;&#1585;&#1575;&#1578;&#1610;&#1580;&#1610;&#1575;&#1578;</a>
    <a href="brain">&#1575;&#1604;&#1593;&#1602;&#1604;</a>
    <a href="system">&#1575;&#1604;&#1606;&#1592;&#1575;&#1605;</a>
  </nav>
  <span class="clock" id="ck"></span>
</header>

<div class="pulse" id="pulseHero">
  <span class="pulse-icon">&#9889;</span>
  <div class="pulse-main">
    <div class="pulse-title" id="pulseTitle">&#1580;&#1575;&#1585;&#1610; &#1575;&#1604;&#1578;&#1581;&#1605;&#1610;&#1604;...</div>
    <div class="pulse-sub" id="pulseSub"></div>
  </div>
  <div class="pulse-stats">
    <div class="ps"><div class="ps-v" style="color:var(--gold)" id="pTotal">-</div><div class="ps-l">&#1573;&#1580;&#1605;&#1575;&#1604;&#1610;</div></div>
    <div class="ps"><div class="ps-v" style="color:var(--grn)" id="pProd">-</div><div class="ps-l">&#1573;&#1606;&#1578;&#1575;&#1580;</div></div>
    <div class="ps"><div class="ps-v" style="color:var(--cyn)" id="pBestEv">-</div><div class="ps-l">&#1571;&#1593;&#1604;&#1609; EV</div></div>
  </div>
</div>

<div class="seg-bar" id="segBar"></div>
<div class="filter-bar" id="filterBar">
  <button class="filter-btn on" data-f="all">&#1575;&#1604;&#1603;&#1604;</button>
  <button class="filter-btn" data-f="1D">&#1610;&#1608;&#1605;&#1610; 1D</button>
  <button class="filter-btn" data-f="30m">30 &#1583;&#1602;&#1610;&#1602;&#1577;</button>
  <button class="filter-btn" data-f="trending">&#1589;&#1575;&#1593;&#1583;</button>
  <button class="filter-btn" data-f="ranging">&#1593;&#1585;&#1590;&#1610;</button>
  <button class="filter-btn" data-f="transition">&#1575;&#1606;&#1578;&#1602;&#1575;&#1604;&#1610;</button>
</div>

<div class="main">
  <div class="loading" id="loader"><div class="spinner"></div><span>&#1580;&#1575;&#1585;&#1610; &#1578;&#1581;&#1605;&#1610;&#1604; &#1575;&#1604;&#1575;&#1587;&#1578;&#1585;&#1575;&#1578;&#1610;&#1580;&#1610;&#1575;&#1578;...</span></div>
  <div class="cards" id="grid" style="display:none"></div>
</div>

<div class="footer">Strategy Mining Engine &#x2014; FP-Growth + Walk-Forward Validation &#x2014; <span id="fTime"></span></div>

<script>
const API = location.hostname === 'localhost' ? 'http://192.168.109.123:9000' : '';
let ALL = [], activeFilter = 'all';

async function load() {
  try {
    const r = await fetch(API + '/dashboard/strategies');
    const d = await r.json();
    ALL = d.strategies || [];
    renderPulse(d);
    renderSegments(d.segments || []);
    renderCards(ALL);
    document.getElementById('fTime').textContent = new Date().toLocaleString('ar-KW');
  } catch(e) {
    document.getElementById('loader').innerHTML = '<span style="color:var(--red)">&#10060; &#1582;&#1591;&#1571; &#1601;&#1610; &#1575;&#1604;&#1578;&#1581;&#1605;&#1610;&#1604;</span>';
  }
}

function renderPulse(d) {
  document.getElementById('pTotal').textContent = d.total || 0;
  const prod = ALL.filter(s => s.status === 'production').length;
  document.getElementById('pProd').textContent = prod;
  const bestEv = ALL.length ? Math.max(...ALL.map(s => s.ev || 0)).toFixed(1) : '0';
  document.getElementById('pBestEv').textContent = bestEv;
  document.getElementById('pulseTitle').innerHTML = d.total + ' \u0627\u0633\u062A\u0631\u0627\u062A\u064A\u062C\u064A\u0629 \u0645\u0643\u062A\u0634\u0641\u0629';
  const top = ALL[0];
  if (top) {
    document.getElementById('pulseSub').innerHTML =
      '\u0623\u0641\u0636\u0644: ' + top.pattern_ar + ' \u2014 EV ' + top.ev.toFixed(1) + ' | Win ' + (top.profitable_rate*100).toFixed(0) + '%';
  }
}

function renderSegments(segs) {
  const regAr = {trending:'\u0635\u0627\u0639\u062F',ranging:'\u0639\u0631\u0636\u064A',transition:'\u0627\u0646\u062A\u0642\u0627\u0644\u064A'};
  const bar = document.getElementById('segBar');
  bar.innerHTML = segs.sort((a,b) => b.avg_ev - a.avg_ev).map(s =>
    `<div class="seg" onclick="filterSeg('${s.timeframe}','${s.regime}')">
      <div class="seg-tf">${s.timeframe}</div>
      <div class="seg-reg">${regAr[s.regime]||s.regime}</div>
      <div class="seg-cnt">${s.cnt}</div>
      <div class="seg-ev">EV ${s.avg_ev.toFixed(1)} | Win ${(s.avg_wr*100).toFixed(0)}%</div>
    </div>`
  ).join('');
}

function filterSeg(tf, reg) {
  activeFilter = tf + '/' + reg;
  const filtered = ALL.filter(s => s.timeframe === tf && s.regime === reg);
  renderCards(filtered);
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('on'));
  document.querySelectorAll('.seg').forEach(s => s.classList.remove('on'));
  event.target.closest('.seg').classList.add('on');
}
</script>

<script>
document.getElementById('filterBar').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  const f = btn.dataset.f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  document.querySelectorAll('.seg').forEach(s => s.classList.remove('on'));
  activeFilter = f;
  let filtered = ALL;
  if (f === '1D') filtered = ALL.filter(s => s.timeframe === '1D');
  else if (f === '30m') filtered = ALL.filter(s => s.timeframe === '30m');
  else if (f === 'trending') filtered = ALL.filter(s => s.regime === 'trending');
  else if (f === 'ranging') filtered = ALL.filter(s => s.regime === 'ranging');
  else if (f === 'transition') filtered = ALL.filter(s => s.regime === 'transition');
  renderCards(filtered);
});

function renderCards(strats) {
  const grid = document.getElementById('grid');
  const loader = document.getElementById('loader');
  if (!strats.length) {
    loader.style.display = 'none';
    grid.style.display = 'block';
    grid.innerHTML = '<div style="text-align:center;padding:3rem;color:var(--t3)">&#1604;&#1575; &#1578;&#1608;&#1580;&#1583; &#1575;&#1587;&#1578;&#1585;&#1575;&#1578;&#1610;&#1580;&#1610;&#1575;&#1578;</div>';
    return;
  }
  loader.style.display = 'none';
  grid.style.display = 'grid';
  grid.innerHTML = strats.map((s, i) => buildCard(s, i)).join('');
}

function buildCard(s, idx) {
  const isTop3 = s.rank <= 3;
  const regAr = {trending:'\u0635\u0627\u0639\u062F',ranging:'\u0639\u0631\u0636\u064A',transition:'\u0627\u0646\u062A\u0642\u0627\u0644\u064A'};
  const tp = s.trade_plan || {};
  const wf = s.walk_forward_parsed || [];

  const evColor = s.ev >= 15 ? 'var(--gold)' : s.ev >= 8 ? 'var(--grn)' : 'var(--t)';
  const wrColor = s.profitable_rate >= 0.65 ? 'var(--grn)' : s.profitable_rate >= 0.5 ? 'var(--amb)' : 'var(--t2)';
  const pfColor = s.profit_factor >= 5 ? 'var(--gold)' : s.profit_factor >= 3 ? 'var(--grn)' : 'var(--t)';
  const stabColor = s.stability >= 1.0 ? 'var(--grn)' : s.stability >= 0.75 ? 'var(--amb)' : 'var(--red)';

  const wfHtml = wf.length ? `<div class="wf-bar">${wf.map(w =>
    `<div class="wf-seg ${w.ev > 0 ? 'pos' : 'neg'}" title="n=${w.n} ev=${w.ev}"></div>`
  ).join('')}</div>` : '';

  return `<div class="s-card ${isTop3 ? 'top3' : ''}">
    <div class="s-head">
      <span class="s-rank">#${s.rank}</span>
      <div class="s-tags">
        <span class="s-tag tf">${s.timeframe}</span>
        <span class="s-tag reg">${regAr[s.regime]||s.regime}</span>
        <span class="s-tag" style="color:var(--t2);background:var(--n8);border:1px solid var(--cb)">${s.sample_size} &#1573;&#1588;&#1575;&#1585;&#1577; | ${s.unique_stocks} &#1587;&#1607;&#1605;</span>
      </div>
    </div>
    <div class="s-body">
      <div class="s-pattern">${s.pattern_ar}</div>
      <div class="s-metrics">
        <div class="sm"><div class="sm-v" style="color:${wrColor}">${(s.profitable_rate*100).toFixed(0)}%</div><div class="sm-l">Win Rate</div></div>
        <div class="sm"><div class="sm-v" style="color:${evColor}">${s.ev.toFixed(1)}</div><div class="sm-l">EV</div></div>
        <div class="sm"><div class="sm-v" style="color:${pfColor}">${s.profit_factor.toFixed(1)}</div><div class="sm-l">PF</div></div>
        <div class="sm"><div class="sm-v ltr">${s.final_score.toFixed(2)}</div><div class="sm-l">Score</div></div>
      </div>
      <div class="s-plan">
        <div class="s-plan-title">&#128200; &#1582;&#1591;&#1577; &#1575;&#1604;&#1589;&#1601;&#1602;&#1577;</div>
        <div class="plan-grid">
          <div class="pg"><div class="pg-v" style="color:var(--cyn)">${s.entry_method || ''}</div><div class="pg-l">&#1575;&#1604;&#1583;&#1582;&#1608;&#1604;</div></div>
          <div class="pg"><div class="pg-v" style="color:var(--grn)">+${s.target_1_pct.toFixed(1)}%</div><div class="pg-l">&#1607;&#1583;&#1601; 1</div></div>
          <div class="pg"><div class="pg-v" style="color:var(--gold)">+${s.target_2_pct.toFixed(1)}%</div><div class="pg-l">&#1607;&#1583;&#1601; 2</div></div>
          <div class="pg"><div class="pg-v" style="color:var(--red)">${s.stop_pct.toFixed(1)}%</div><div class="pg-l">&#1587;&#1578;&#1608;&#1576;</div></div>
          <div class="pg"><div class="pg-v">${s.rr_ratio.toFixed(1)}x</div><div class="pg-l">R/R</div></div>
          <div class="pg"><div class="pg-v">~${s.est_hold_days.toFixed(0)}d</div><div class="pg-l">&#1575;&#1604;&#1605;&#1583;&#1577;</div></div>
        </div>
      </div>
      <div class="s-valid">
        <span class="sv ${s.p_value <= 0.01 ? 'good' : s.p_value <= 0.05 ? 'good' : 'warn'}">p=${s.p_value < 0.001 ? '<0.001' : s.p_value.toFixed(3)}</span>
        <span class="sv ${s.stability >= 1.0 ? 'good' : s.stability >= 0.75 ? 'good' : 'warn'}">Stab ${(s.stability*100).toFixed(0)}%</span>
        <span class="sv">${s.unique_months || '?'}m</span>
      </div>
      ${wfHtml}
    </div>
  </div>`;
}

// Clock
function ck(){const d=new Date();document.getElementById('ck').textContent=d.toLocaleTimeString('en',{hour12:false})}
setInterval(ck,1000);ck();

load();
setInterval(load, 300000); // refresh every 5 min
</script>
</body>
</html>
