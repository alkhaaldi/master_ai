              {% set e = 'sensor.master_ai_extended' %}
              {% set d = state_attr(e,'news_digest') %}
              {% if d and d.urgent %}
              {{ d.urgent }}
              {% else %}
              ✅ لا أخبار عاجلة
              {% endif %}

          # ── ECONOMY & MARKETS ──
