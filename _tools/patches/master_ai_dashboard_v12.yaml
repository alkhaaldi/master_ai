title: Master AI
views:
  - path: master-ai
    title: Master AI
    icon: mdi:brain
    type: panel
    cards:
      - type: vertical-stack
        cards:

          # ── 1. HERO (compact) ──
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(135deg, rgba(0,170,255,0.10), rgba(0,170,255,0.04));
                  border: 1px solid rgba(0,170,255,0.12);
                  border-radius: 18px 18px 0 0;
                  padding: 10px 16px 6px;
                  margin: 6px 8px 0;
                }
                h2 { font-size: 18px !important; margin: 0 !important; }
                ha-markdown { font-size: 14px; opacity: 0.8; }
            content: |
              ## Master AI
              {% set d = 'sensor.master_ai_dashboard' %}
              v{{ state_attr(d,'version') | default('—') }} · Uptime {{ ((state_attr(d,'uptime') | float(0)) / 3600) | round(1) }}h · {% if state_attr(d,'degraded_mode') and state_attr(d,'degraded_mode') != 'normal' %}⚠️ {{ state_attr(d,'degraded_mode') }}{% else %}✅ مستقر{% endif %}

          # ── 2. DECISION CARD ──
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  {% set d = 'sensor.master_ai_dashboard' %}
                  {% set asf = state_attr(d,'assistant_surface') %}
                  {% set urg = '' %}
                  {% if asf and asf.top_action %}{% set urg = asf.top_action.urgency | default('info') %}{% endif %}
                  background: rgba(255,255,255,0.02);
                  border: 1px solid rgba(255,255,255,0.06);
                  {% if urg == 'critical' %}
                  border-right: 4px solid #e74c3c;
                  {% elif urg == 'high' %}
                  border-right: 4px solid #e67e22;
                  {% elif urg == 'medium' %}
                  border-right: 4px solid #f1c40f;
                  {% else %}
                  border-right: 4px solid #27ae60;
                  {% endif %}
                  border-radius: 16px;
                  padding: 12px 16px;
                  margin: 6px 8px 0;
                }
                ha-markdown { font-size: 14px; direction: rtl; line-height: 1.7; }
            content: >
              {% set d = 'sensor.master_ai_dashboard' %}
              {% set asf = state_attr(d,'assistant_surface') %}
              {% if asf and asf.top_action and asf.top_action.headline %}
              {% set ta = asf.top_action %}
              {% set urg = ta.urgency | default('info') %}
              {% if urg == 'critical' %}🚨{% elif urg == 'high' %}🔴{% elif urg == 'medium' %}🟡{% else %}🟢{% endif %}
              **{{ ta.headline }}**

              {{ ta.why_now | default('') }}
              {% if ta.consequence %}

              ⚠️ {{ ta.consequence }}
              {% endif %}
              {% if ta.recommendation %}

              💡 {{ ta.recommendation }}
              {% endif %}
              {% if ta.primary_action %}

              ⬅️ **{{ ta.primary_action.label | default('') }}**{% if ta.secondary_action %} · {{ ta.secondary_action.label | default('') }}{% endif %}
              {% endif %}
              {% if ta.confidence and ta.confidence != 'high' %}

              📊 ثقة: {{ ta.confidence }}
              {% endif %}
              {% elif asf and asf.meta and asf.meta.quiet_mode %}
              ✅ **كل شيء تحت السيطرة** — لا توجد عناصر عاجلة
              {% else %}
              🤖 {{ state_attr(d,'ai_insight') | default('جاري التحميل...') }}
              {% endif %}
          # ── 2b. NEXT ACTIONS ──
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  {% set d = 'sensor.master_ai_dashboard' %}
                  {% set asf = state_attr(d,'assistant_surface') %}
                  {% if not asf or not asf.next_actions or asf.next_actions | length == 0 %}
                  display: none;
                  {% else %}
                  background: rgba(255,255,255,0.02);
                  border: 1px solid rgba(255,255,255,0.06);
                  border-radius: 16px;
                  padding: 8px 14px;
                  margin: 4px 8px 0;
                  {% endif %}
                }
                ha-markdown { font-size: 14px; direction: rtl; line-height: 1.7; }
            content: >
              {% set d = 'sensor.master_ai_dashboard' %}
              {% set asf = state_attr(d,'assistant_surface') %}
              {% if asf and asf.next_actions and asf.next_actions | length > 0 %}
              {% for item in asf.next_actions[:3] %}
              {% set urg = item.urgency | default('info') %}
              {% if urg == 'high' %}🔴{% elif urg == 'medium' %}🟡{% else %}🔵{% endif %}
              {{ item.headline }}{% if item.why_now %} · {{ item.why_now }}{% endif %}

              {% endfor %}
              {% endif %}

          # ── 2c. LATER TODAY (V12) ──
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  {% set d = 'sensor.master_ai_dashboard' %}
                  {% set asf = state_attr(d,'assistant_surface') %}
                  {% if not asf or not asf.later_today or asf.later_today | length == 0 %}
                  display: none;
                  {% else %}
                  background: rgba(255,255,255,0.02);
                  border: 1px solid rgba(255,255,255,0.06);
                  border-radius: 16px;
                  padding: 8px 14px;
                  margin: 4px 8px 0;
                  {% endif %}
                }
                ha-markdown { font-size: 14px; direction: rtl; line-height: 1.7; }
            content: >
              {% set d = 'sensor.master_ai_dashboard' %}
              {% set asf = state_attr(d,'assistant_surface') %}
              {% if asf and asf.later_today and asf.later_today | length > 0 %}
              ⏳ **لاحقاً اليوم**
              {% for item in asf.later_today[:3] %}
              · {{ item.headline }}{% if item.delay_cost %} — {{ item.delay_cost }}{% endif %}
              {% endfor %}
              {% endif %}

          # ── 3. SHIFT + STATUS (shift first & highlighted) ──
          - type: grid
            columns: 4
            square: false
            cards:
              - type: markdown
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(0,170,255,0.06);
                      border: 1px solid rgba(0,170,255,0.14);
                      border-radius: 18px;
                      padding: 10px 8px;
                      text-align: center;
                    }
                    ha-markdown { font-size: 14px; direction: rtl; }
                content: >
                  {% set d = 'sensor.master_ai_dashboard' %}
                  🔄 **{{ state_attr(d,'shift_today') | default('—') }}**

                  غداً: {{ state_attr(d,'shift_tomorrow') | default('—') }}
              - type: markdown
                card_mod:
                  style: |
                    ha-card { border-radius: 18px; padding: 10px 8px; text-align: center; }
                    ha-markdown { font-size: 14px; direction: rtl; }
                content: >
                  💡{{ state_attr('sensor.master_ai_dashboard','home_lights_on') | int(0) }}
                  ❄️{{ state_attr('sensor.master_ai_dashboard','home_ac_on') | int(0) }}
                  🪟{{ state_attr('sensor.master_ai_dashboard','home_covers_open') | int(0) }}

                  نبض البيت
              - type: markdown
                card_mod:
                  style: |
                    ha-card { border-radius: 18px; padding: 10px 8px; text-align: center; }
                    ha-markdown { font-size: 14px; direction: rtl; }
                content: >
                  {% set d = 'sensor.master_ai_dashboard' %}
                  {% if state_attr(d,'market_open') %}🟢 **مفتوح**{% else %}⚫ **مغلق**{% endif %}

                  الرادار {{ '✅' if state_attr(d,'radar_enabled') else '⏸' }}
              - type: markdown
                card_mod:
                  style: |
                    ha-card { border-radius: 18px; padding: 10px 8px; text-align: center; }
                    ha-markdown { font-size: 14px; direction: rtl; }
                content: >
                  {% set d = 'sensor.master_ai_dashboard' %}
                  {% set ev = state_attr(d,'next_event') | default('') %}
                  📅 **{{ ev[:16] if ev else 'لا مواعيد' }}**

                  {{ state_attr(d,'events_today') | int(0) }} اليوم

          # ── 4. TOP STOCK TEASER (single best) ──
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(135deg, rgba(255,170,0,0.06), rgba(255,200,60,0.03));
                  border: 1px solid rgba(255,170,0,0.12);
                  border-radius: 18px;
                  padding: 10px 16px;
                  margin-top: 8px;
                }
                ha-markdown { font-size: 14px; direction: rtl; line-height: 1.7; }
            content: >
              {% set r = 'sensor.master_ai_radar' %}
              {% set ctx = state_attr(r,'radar_daily_context') %}
              {% if ctx and ctx | length > 0 %}
              {% set s = ctx[0] %}
              ⭐ **{{ s.name_ar | default(s.symbol) }}** — {{ s.price }}ف {% if s.change_pct is not none %}{% if s.change_pct >= 0 %}🟢 +{{ s.change_pct | round(1) }}%{% else %}🔴 {{ s.change_pct | round(1) }}%{% endif %}{% endif %} · {{ s.score }}/{{ s.score_class }}
              {% if s.action_ar %} · 💡 {{ s.action_ar }}{% endif %}{% if s.ema_cross == 'bullish' %} · 📈 EMA{% elif s.ema_cross == 'bearish' %} · 📉 EMA{% endif %}
              {% if ctx | length > 1 %} · +{{ ctx | length - 1 }} أسهم{% endif %}
              {% else %}
              📊 لا بيانات — السوق مغلق
              {% endif %}

          # ── 6. COMMAND FEEDBACK (V12: hidden when empty) ──
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  {% if not state_attr('sensor.master_ai_dashboard','last_cmd_command') %}
                  display: none;
                  {% else %}
                  background: rgba(255,255,255,0.02);
                  border: 1px solid rgba(255,255,255,0.06);
                  border-radius: 16px;
                  padding: 6px 14px;
                  margin-top: 6px;
                  {% endif %}
                }
                ha-markdown { font-size: 14px; opacity: 0.85; }
            content: >
              {% set d = 'sensor.master_ai_dashboard' %}
              {% set cmd = state_attr(d,'last_cmd_command') | default('') %}
              {% if cmd %}
              {% set st = state_attr(d,'last_cmd_status') | default('?') %}
              {% if st == 'done' %}✅{% elif st == 'error' %}❌{% elif st == 'timeout' %}⏳{% else %}🔄{% endif %}
              **{{ cmd }}** @ {{ state_attr(d,'last_cmd_time') | default('') }}
              · {{ state_attr(d,'last_cmd_result') | default('') | truncate(80) }}
              {% endif %}

          # ── 7. NAVIGATION (V12: 7 columns) ──
          - type: grid
            columns: 7
            square: false
            cards:
              - type: button
                name: التداول
                icon: mdi:chart-areaspline
                tap_action:
                  action: navigate
                  navigation_path: /master-ai-dashboard/sub-radar
                show_state: false
              - type: button
                name: المواعيد
                icon: mdi:calendar-check
                tap_action:
                  action: navigate
                  navigation_path: /master-ai-dashboard/sub-calendar-tasks
                show_state: false
              - type: button
                name: البيت
                icon: mdi:home-thermometer-outline
                tap_action:
                  action: navigate
                  navigation_path: /master-ai-dashboard/sub-home
                show_state: false
              - type: button
                name: المساعد
                icon: mdi:robot-outline
                tap_action:
                  action: navigate
                  navigation_path: /master-ai-dashboard/sub-assistant
                show_state: false
              - type: button
                name: النظام
                icon: mdi:server
                tap_action:
                  action: navigate
                  navigation_path: /master-ai-dashboard/sub-system-health
                show_state: false
              - type: button
                name: البريد
                icon: mdi:email-outline
                tap_action:
                  action: navigate
                  navigation_path: /master-ai-dashboard/sub-email
                show_state: false
              - type: button
                name: الأخبار
                icon: mdi:newspaper-variant-outline
                tap_action:
                  action: navigate
                  navigation_path: /master-ai-dashboard/sub-news
                show_state: false

  - path: sub-radar
    title: الرادار
    icon: mdi:radar
    subview: true
    type: panel
    cards:
      - type: vertical-stack
        cards:

          # ── L1: MARKET PULSE BAR ──
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(135deg, rgba(0,170,255,0.10), rgba(0,170,255,0.04));
                  border: 1px solid rgba(0,170,255,0.12);
                  border-radius: 18px;
                  padding: 10px 16px 6px;
                  margin: 6px 8px 0;
                }
                h2 { font-size: 18px !important; margin: 0 !important; }
                ha-markdown { font-size: 14px; opacity: 0.85; direction: rtl; }
            content: |
              ## منصة التداول
              {% set r = 'sensor.master_ai_radar' %}{% set d = 'sensor.master_ai_dashboard' %}
              {% if state_attr(d,'market_open') %}🟢 مفتوح{% else %}⚫ مغلق{% endif %} · الرادار {{ '✅' if state_attr(r,'radar_enabled') else '⏸' }} · {{ state_attr(r,'radar_watch_count') | int(0) }} سهم{% if state_attr(r,'radar_alerts_today') | int(0) > 0 %} · 🔔 {{ state_attr(r,'radar_alerts_today') }}{% endif %}{% set ts = state_attr(d,'top_signal') | default('') %}{% if ts %} · {{ ts }}{% endif %}

          # ── V12: QUICK ACTIONS ──
          - type: grid
            columns: 4
            square: false
            cards:
              - type: button
                name: تبديل الرادار
                icon: mdi:radar
                tap_action:
                  action: call-service
                  service: script.turn_on
                  target:
                    entity_id: script.master_ai_radar_toggle
                show_state: false
                card_mod:
                  style: |
                    ha-card { border-radius: 14px; height: 48px; }
                    ha-card .name { font-size: 11px !important; }
              - type: button
                name: الأسهم
                icon: mdi:chart-bar
                tap_action:
                  action: call-service
                  service: script.turn_on
                  target:
                    entity_id: script.master_ai_stocks
                show_state: false
                card_mod:
                  style: |
                    ha-card { border-radius: 14px; height: 48px; }
                    ha-card .name { font-size: 11px !important; }
              - type: button
                name: أعلى
                icon: mdi:arrow-up-bold
                tap_action:
                  action: call-service
                  service: script.turn_on
                  target:
                    entity_id: script.master_ai_radar_top
                show_state: false
                card_mod:
                  style: |
                    ha-card { border-radius: 14px; height: 48px; }
                    ha-card .name { font-size: 11px !important; }
              - type: button
                name: الحالة
                icon: mdi:information-outline
                tap_action:
                  action: call-service
                  service: script.turn_on
                  target:
                    entity_id: script.master_ai_radar_status
                show_state: false
                card_mod:
                  style: |
                    ha-card { border-radius: 14px; height: 48px; }
                    ha-card .name { font-size: 11px !important; }

          # ── STALE DATA WARNING ──
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  {% set r = 'sensor.master_ai_radar' %}
                  {% set ctx = state_attr(r,'radar_daily_context') %}
                  {% if ctx and ctx | length > 0 and ctx[0].data_age_hours | float(0) > 1 %}
                  background: rgba(231,76,60,0.08);
                  border: 2px solid rgba(231,76,60,0.25);
                  {% else %}
                  display: none;
                  {% endif %}
                  border-radius: 14px;
                  padding: 8px 14px;
                  margin: 6px 8px 0;
                }
                ha-markdown { font-size: 14px; direction: rtl; }
            content: >
              {% set r = 'sensor.master_ai_radar' %}
              {% set ctx = state_attr(r,'radar_daily_context') %}
              {% if ctx and ctx | length > 0 %}
              {% set age = ctx[0].data_age_hours | float(0) %}
              {% if age > 1 %}
              ⚠️ **تحذير:** البيانات قديمة ({{ age | round(1) }} ساعة) — قد لا تعكس الأسعار الحالية
              {% endif %}
              {% endif %}

          # ── L2: DECISION CARD (أقوى فرصة) ──
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  background:
                    linear-gradient(135deg, rgba(255,170,0,0.10), rgba(255,200,60,0.04));
                  border: 2px solid rgba(255,170,0,0.20);
                  border-radius: 18px;
                  padding: 14px 16px;
                  margin: 10px 8px 0;
                  box-shadow: 0 4px 16px rgba(255,170,0,0.06);
                }
                ha-markdown { font-size: 14px; line-height: 1.9; direction: rtl; }
            content: |
              {% set r = 'sensor.master_ai_radar' %}
              {% set ctx = state_attr(r,'radar_daily_context') %}
              {% set sig = state_attr(r,'radar_recent_signals') or [] %}
              {% set sig_syms = sig | map(attribute='symbol') | list %}
              {% if ctx and ctx | length > 0 %}
              {% set s = ctx[0] %}
              {% if s.score_class == 'A' %}⭐{% elif s.score_class == 'B' %}🔵{% else %}⚪{% endif %} **{{ s.name_ar | default(s.symbol) }}** — {{ s.price }} فلس

              {% if s.change_pct is not none %}{% if s.change_pct >= 0 %}🟢 **▲ +{{ s.change_pct | round(1) }}%**{% else %}🔴 **▼ {{ s.change_pct | round(1) }}%**{% endif %}{% endif %} · تقييم **{{ s.score }}/{{ s.score_class }}** · RSI {{ s.rsi | round(0) if s.rsi is not none else '—' }}

              📊 فريم: {{ s.source_timeframe | default('—') }} · Volume: {% if s.vol_ratio is not none %}×{{ s.vol_ratio | round(1) }}{% else %}—{% endif %}{% if s.symbol in sig_syms %} · 📡 **إشارة 30m**{% endif %}

              {% if s.ema_cross == 'bullish' %}📈 EMA: تقاطع صاعد{% elif s.ema_cross == 'bearish' %}📉 EMA: تقاطع هابط{% else %}➡️ EMA: محايد{% endif %}{% if s.ema_gap_pct is not none %} ({{ s.ema_gap_pct | round(1) }}%){% endif %}

              {% if s.trend == 'صاعد' %}📈 صاعد{% elif s.trend == 'هابط' %}📉 هابط{% else %}➡️ محايد{% endif %}{% if s.verdict %} — {{ s.verdict[:40] }}{% endif %}

              💡 **{{ s.action_ar | default('—') }}**{% if s.support is not none %} · دعم: {{ s.support }}{% endif %}{% if s.resistance is not none %} · مقاومة: {{ s.resistance }}{% endif %}
              {% else %}
              📊 لا بيانات يومية — السوق مغلق أو لم يُحدّث
              {% endif %}

          # ── L3: TOP OPPORTUNITIES (table) ──
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  background: rgba(255,255,255,0.02);
                  border: 1px solid rgba(255,170,0,0.10);
                  border-radius: 18px;
                  padding: 14px 16px;
                  margin: 10px 8px 0;
                }
                ha-markdown { font-size: 14px; line-height: 1.8; direction: rtl; }
            content: |
              {% set r = 'sensor.master_ai_radar' %}
              {% set ctx = state_attr(r,'radar_daily_context') %}
              {% if ctx and ctx | length > 1 %}
              **📊 نظرة فنية** ({{ ctx | length - 1 }} سهم)

              | السهم | السعر | %Δ | Vol | RSI | EMA | Score | الاتجاه | Action |
              |:------|------:|---:|----:|:---:|:---:|:-----:|:-------:|:------:|
              {% for s in ctx[1:] %}| {{ s.name_ar | default(s.symbol) }} | {{ s.price }} | {% if s.change_pct is not none %}{{ s.change_pct | round(1) }}{% else %}—{% endif %} | {% if s.vol_ratio is not none %}×{{ s.vol_ratio | round(1) }}{% else %}—{% endif %} | {{ s.rsi | round(0) | int if s.rsi is not none else '—' }} | {% if s.ema_cross == 'bullish' %}📈{% elif s.ema_cross == 'bearish' %}📉{% else %}➡️{% endif %} | {{ s.score }}/{{ s.score_class }} | {% if s.trend == 'صاعد' %}📈{% elif s.trend == 'هابط' %}📉{% else %}➡️{% endif %} | {{ s.action_ar | default('—') }} |
              {% endfor %}
              {% else %}
              📊 لا بيانات
              {% endif %}

          # ── L5: 30m SIGNAL FLASH (table) ──
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  background: rgba(0,170,255,0.04);
                  border: 1px solid rgba(0,170,255,0.10);
                  border-radius: 16px;
                  padding: 10px 16px;
                  margin: 10px 8px 0;
                }
                ha-markdown { font-size: 14px; line-height: 1.9; direction: rtl; }
            content: |
              {% set r = 'sensor.master_ai_radar' %}
              {% set signals = state_attr(r,'radar_recent_signals') %}
              {% if signals and signals | length > 0 %}
              **📡 إشارات 30m** ({{ signals | length }})

              | السهم | السعر | الوقت | النوع | Score | القوة |
              |:------|------:|:-----:|:-----:|:-----:|:-----:|
              {% for s in signals[:5] %}| {{ s.name_ar | default(s.symbol) }} | {{ s.price }}ف | {{ s.time[-5:] if s.time | length > 5 else s.time }} | {% if s.type_ar | default('') == 'صاعد' %}🟢{% else %}🔴{% endif %} | {{ s.score }}/{{ s.score_class }} | {{ s.strength | default('—') }} |
              {% endfor %}
              {% endif %}



          # ── WATCHLIST GRID (V12: capped to 6) ──
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  background: rgba(255,255,255,0.02);
                  border: 1px solid rgba(255,255,255,0.04);
                  border-radius: 16px;
                  padding: 10px 16px;
                  margin: 8px 8px 0;
                }
                ha-markdown { font-size: 14px; direction: rtl; line-height: 1.8; }
            content: |
              {% set wl = state_attr('sensor.master_ai_radar','radar_watchlist') %}
              {% if wl and wl | length > 0 %}
              **🔍 المراقبة** ({{ wl | length }} سهم)

              | السهم | السعر | %Δ | الفريم | السبب |
              |:------|------:|---:|:------:|:------|
              {% for s in wl[:6] %}| {{ s.name_ar | default(s.symbol) }} | {{ s.price | default('—') }} | {% if s.change_pct is not none %}{{ s.change_pct | round(1) }}%{% else %}—{% endif %} | {{ s.timeframe | default('—') }} | {{ s.watch_reason | default('مراقبة') }} |
              {% endfor %}
              {% endif %}

          # ── JOURNAL: OPEN POSITIONS ──
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  background: rgba(39,174,96,0.04);
                  border: 1px solid rgba(39,174,96,0.10);
                  border-right: 3px solid rgba(39,174,96,0.30);
                  border-radius: 0;
                  padding: 14px 16px;
                  margin: 10px 8px 0;
                }
                ha-markdown { font-size: 14px; direction: rtl; line-height: 1.8; }
            content: |
              {% set r = 'sensor.master_ai_radar' %}
              {% set trades = state_attr(r,'journal_open') %}
              {% set stats = state_attr(r,'journal_stats') %}
              {% if trades and trades | length > 0 %}
              **📂 صفقات مفتوحة** ({{ trades | length }})

              | السهم | الدخول | الكمية | السبب | الاستراتيجية |
              |:------|------:|------:|:------|:------------|
