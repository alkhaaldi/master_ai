  # ═══ NEWS PAGE (V12: structured) ═══
  - path: sub-news
    title: الأخبار
    icon: mdi:newspaper-variant-outline
    subview: true
    type: panel
    cards:
      - type: vertical-stack
        cards:

          # ── HERO (smart counter) ──
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(135deg, rgba(255,200,60,0.10), rgba(255,200,60,0.04));
                  border: 1px solid rgba(255,200,60,0.12);
                  border-radius: 18px;
                  padding: 10px 16px 6px;
                  margin: 6px 8px 0;
                }
                h2 { font-size: 18px !important; margin: 0 !important; }
                ha-markdown { font-size: 14px; opacity: 0.85; direction: rtl; }
            content: |
              ## الأخبار
              {% set e = 'sensor.master_ai_extended' %}
              {% set d = state_attr(e,'news_digest') %}
              {% if d %}
              {% set urgent_count = d.urgent.split('\n') | reject('eq','') | list | length if d.urgent else 0 %}
              {% set econ_count = d.economic.split('\n') | reject('eq','') | list | length if d.economic else 0 %}
              {% set local_count = d.local.split('\n') | reject('eq','') | list | length if d.local else 0 %}
              {% set tech_count = d.tech.split('\n') | reject('eq','') | list | length if d.tech else 0 %}
              {% set ai_count = d.ai.split('\n') | reject('eq','') | list | length if d.ai is defined and d.ai else 0 %}
              {% set gadget_count = d.gadgets.split('\n') | reject('eq','') | list | length if d.gadgets is defined and d.gadgets else 0 %}
              {% if urgent_count > 0 %}🔴 {{ urgent_count }} عاجل{% endif %}{% if econ_count > 0 %} · 💰 {{ econ_count }} اقتصادي{% endif %}{% if local_count > 0 %} · 🇰🇼 {{ local_count }} محلي{% endif %}{% if tech_count > 0 %} · 💻 {{ tech_count }} تقني{% endif %}{% if ai_count > 0 %} · 🤖 {{ ai_count }} AI{% endif %}{% if gadget_count > 0 %} · 📱 {{ gadget_count }} أجهزة{% endif %} · 📰 {{ d.item_count | default(0) }} خبر · {{ d.date | default('') }}
              {% set created = d.created_at | default('') %}
              {% if created %}
              {% set hours_ago = ((as_timestamp(now()) - as_timestamp(created)) / 3600) | round(1) %}
              {% if hours_ago > 12 %}

              🔴 **قديمة** — آخر تحديث قبل {{ hours_ago | round(0) | int }} ساعة
              {% elif hours_ago > 6 %}

              🟡 آخر تحديث قبل {{ hours_ago | round(0) | int }} ساعة
              {% endif %}
              {% endif %}
              {% else %}
              📰 لا أخبار — استخدم /news_now
              {% endif %}

          # ── V12: TOP 3 DECISION CARD ──
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  {% set e = 'sensor.master_ai_extended' %}
                  {% set d = state_attr(e,'news_digest') %}
                  {% if not d or not d.news_items is defined or d.news_items | length == 0 %}
                  display: none;
                  {% else %}
                  background: linear-gradient(135deg, rgba(231,76,60,0.06), rgba(231,76,60,0.02));
                  border: 1px solid rgba(231,76,60,0.12);
                  border-radius: 18px;
                  padding: 12px 16px;
                  margin: 6px 8px 0;
                  {% endif %}
                }
                ha-markdown { font-size: 14px; direction: rtl; line-height: 2.0; }
            content: |
              {% set e = 'sensor.master_ai_extended' %}
              {% set d = state_attr(e,'news_digest') %}
              {% if d and d.news_items is defined and d.news_items | length > 0 %}
              **⚡ أهم 3 أخبار**
              {% for item in d.news_items[:3] %}
              {{ item.emoji }} **{{ item.text[:80] }}**{% if item.source %} ({{ item.source }}){% endif %}

              {% endfor %}
              {% endif %}

          # ── URGENT / IMPORTANT NEWS ──
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  {% set e = 'sensor.master_ai_extended' %}
                  {% set d = state_attr(e,'news_digest') %}
                  {% if not d or not d.urgent %}
                  display: none;
                  {% else %}
                  background: rgba(231,76,60,0.04);
                  border: 1px solid rgba(231,76,60,0.10);
                  border-right: 3px solid rgba(231,76,60,0.30);
                  border-radius: 16px;
                  padding: 12px 16px;
                  margin: 6px 8px 0;
                  {% endif %}
